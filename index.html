<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#b23a6a">
<meta name="robots" content="noindex,nofollow">
<title>CULAC — ระบบบริหารโครงการบริการวิชาการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#d95a8c; --pink-d:#b23a6a; --pink-l:#fce7ef; --pink-xl:#fff7fb;
  --ink:#2b2230; --muted:#665a6e; --line:#f0e3ea; --line-d:#e6d3de;
  --green:#1a7a47; --green-l:#e7f6ee; --red:#d23b3b; --red-l:#fdecec;
  --amber:#945a00; --amber-l:#fdf3e2; --bg:#faf6f8; --card:#ffffff;
  --shadow:0 1px 3px rgba(120,30,70,.06),0 6px 24px rgba(120,30,70,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:999;background:#fff;color:var(--pink-d);padding:8px 14px;border-radius:8px;border:2px solid var(--pink-d);font-weight:600}.skip:focus{left:8px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #1f4b7a;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Sarabun',sans-serif}
a{color:var(--pink-d);text-decoration:none}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:248px;background:linear-gradient(180deg,#b8386c 0%,#8a2450 100%);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.45) transparent}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.45);border-radius:6px}
.brand{padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px}
.brand .logo{font-family:'Sarabun';font-weight:700;font-size:19px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .sub{font-size:12px;opacity:.85;margin-top:3px;font-weight:300}
.nav button{width:100%;text-align:left;background:transparent;border:0;color:#fff;padding:11px 13px;border-radius:10px;font-family:'Sarabun';font-size:14.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.15s;opacity:1}
.nav button:hover{background:rgba(255,255,255,.18)}
.nav button.on{background:#fff;color:var(--pink-d);font-weight:700;opacity:1;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nav button svg.ni,.ext-link svg.ni{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .brand-sub,.side .foot{opacity:.92}
.clock{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 10px;margin-bottom:9px;color:#fff;text-align:center;line-height:1.35}
.clock .t{font-size:17px;font-weight:700;letter-spacing:.5px}
.clock .d{font-size:11.5px;opacity:.9}
.nav-group{font-family:'Sarabun';font-size:10.5px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.06em;padding:13px 13px 4px;margin-top:3px;border-top:1px solid rgba(255,255,255,.1)}
.nav-group.first{margin-top:0;border-top:0;padding-top:2px}
.nav-group.hide{display:none}
.nav .ic{width:20px;text-align:center;font-size:16px}
.side .foot{margin-top:auto;font-size:12.5px;opacity:1;padding:10px;font-weight:400}
.side .foot .ver{display:inline-block;background:#4a1b35;color:#fff;font-weight:600;padding:2px 9px;border-radius:999px;font-size:12px}

/* Main */
.main{flex:1;min-width:0;padding:26px 30px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:600;color:var(--pink-d)}
.head .desc{color:var(--muted);font-size:13.5px;margin-top:2px}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:26px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.card .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.card .val{font-family:'Sarabun';font-weight:600;font-size:27px;margin-top:7px;line-height:1.1}
.card .unit{font-size:12px;color:var(--muted);font-weight:400}
.card.accent{background:linear-gradient(135deg,var(--pink) 0%,var(--pink-d) 100%);border:0;color:#fff}
.card.accent .lbl,.card.accent .unit{color:rgba(255,255,255,.85)}
.card.warn .val{color:var(--amber)} .card.ok .val{color:var(--green)}

/* Table */
.panel{background:var(--card);border-radius:14px;box-shadow:0 3px 12px rgba(23,38,58,.09);border:1.5px solid #dbe5f0;overflow:hidden;margin-bottom:14px}
.panel-h{padding:12px 18px;border-bottom:1.5px solid #dbe5f0;background:linear-gradient(100deg,#eef4fb,#f7fafe);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h h2{font-size:16px;font-weight:700;color:#173355;display:flex;align-items:center;gap:9px}
.panel-h h2::before{content:'';width:5px;height:19px;border-radius:3px;background:var(--pink);flex-shrink:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--pink-xl);color:var(--pink-d);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line-d);font-size:12.5px;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:.12s} tbody tr:hover{background:var(--pink-xl)} tbody tr.clk{cursor:pointer}
.r{text-align:right;font-variant-numeric:tabular-nums} .c{text-align:center} .nowrap{white-space:nowrap}
.tbl-wrap td.r,.tbl-wrap th.r{white-space:nowrap}   /* v25: ตัวเลข/ประเภทไม่ถูกบีบจนตัดบรรทัด ตารางเลื่อนแนวนอนแทน */
.tnum{font-family:'Sarabun';font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.open{background:var(--amber-l);color:var(--amber)} .pill.closed{background:var(--green-l);color:var(--green)}
.pill.wait{background:#eee7f4;color:#7a54c9}
.pill.unpaid{background:var(--red-l);color:var(--red)} .pill.paid{background:var(--green-l);color:var(--green)}
.pct-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:54px}
.pct-bar i{display:block;height:100%;background:var(--pink);border-radius:4px}
.in{color:var(--green);font-weight:600} .out{color:var(--red);font-weight:600}
/* lock screen */
.lock{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,var(--pink) 0%,var(--pink-d) 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.lock.hide{display:none}
.lock-card{background:#fff;border-radius:20px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.lock-logo{font-family:'Sarabun';font-weight:700;font-size:26px;color:var(--pink-d)}
.lock-title{font-weight:600;font-size:15px;margin-top:8px}
.lock-sub{font-size:12.5px;color:var(--muted);margin-bottom:22px}
.lock-lbl{font-size:13px;font-weight:500;display:block;text-align:left;margin-bottom:6px}
#pin{font-family:'Sarabun';font-size:22px;text-align:center;letter-spacing:6px;padding:12px;border:1.5px solid var(--line-d);border-radius:12px;width:100%;margin-bottom:6px}
#pin:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-l)}
.lock-err{color:var(--red);font-size:12.5px;height:18px;margin-bottom:8px;visibility:hidden}
.lock-err.show{visibility:visible}
.lock-roles{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.5}
.role-badge{font-size:12.5px;background:rgba(255,255,255,.16);border-radius:8px;padding:6px 9px;line-height:1.4}
.role-badge b{font-weight:600}.role-badge .lo{color:#fff;text-decoration:underline;cursor:pointer;opacity:.85}
body.role-viewer .canedit{display:none!important}
.sec-own{font-family:'Sarabun';font-weight:500;font-size:12.5px;color:var(--pink-d);background:var(--pink-xl);padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.sec-own.locked{color:#8a7f90;background:#f0ecef}
.fsec.sec-locked{opacity:.72;position:relative}
.fsec.sec-locked input,.fsec.sec-locked select,.fsec.sec-locked textarea{background:#f4eef1!important;cursor:not-allowed}
/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(43,34,48,.45);z-index:150;display:none}
.modal-scrim.show{display:block}
.modal{position:fixed;z-index:160;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;transition:.18s;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.3);width:min(560px,92vw);max-height:88vh;overflow-y:auto;padding:22px 24px}
.modal.wide{width:min(1060px,96vw);padding:22px 28px}
.modal.wide .bud-tbl{min-width:0;font-size:15px;margin-top:8px}
.modal.wide .bud-tbl th,.modal.wide .bud-tbl td{padding:9px 12px}
.modal.wide .bud-tbl td input{font-size:17px;padding:9px 12px;min-height:44px;text-align:right;font-weight:600;border-width:1.5px}
.modal.wide .bud-tbl td input:not(:disabled){background:#fffdf5;border-color:#d9a3bd}
.modal.wide .bud-tbl td.diff{font-weight:600;white-space:nowrap}
.modal.wide .bud-tbl td.diff.up{color:#1f7a4d}.modal.wide .bud-tbl td.diff.dn{color:#a01e1e}
.rev-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
.rev-sum>div{background:var(--pink-xl);border:1px solid var(--line-d);border-radius:10px;padding:9px 13px}
.rev-sum .k{font-size:12.5px;color:var(--pink-d);font-weight:600}.rev-sum .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.rev-sum .v small{font-size:13px;font-weight:600;margin-left:6px}
.rev-sum .neg{color:#a01e1e}
@media(max-width:760px){.rev-sum{grid-template-columns:1fr}.modal.wide{padding:16px}}
.modal.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.modal .mh{font-family:'Sarabun';font-weight:600;font-size:16px;color:var(--pink-d);margin-bottom:16px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal .fld{margin-bottom:0}
.rn-item{padding:12px 15px;margin:10px 0;border:1px solid var(--line);border-left:5px solid var(--pink);border-radius:12px;background:linear-gradient(180deg,#fff9fc,#fff);box-shadow:0 3px 10px rgba(178,58,106,.07)}
.rn-item .rn-h{font-size:14px;font-weight:700;color:var(--pink-d);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rn-item .rn-b{font-size:13.5px;color:var(--ink);margin-top:7px;line-height:1.7}
.rn-item .rn-b>div{padding:2px 0}
.rn-badge{display:inline-block;background:var(--pink);color:#fff;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap}
.reg-sub.hot{font-size:15px;font-weight:700;color:var(--ink);margin:18px 0 4px;padding-top:14px;border-top:2px solid var(--pink-l);display:flex;align-items:center;gap:9px}
.reg-sub.hot .cnt{background:var(--pink-l);color:var(--pink-d);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.bud-tbl{width:100%;min-width:540px;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
.bud-tbl th,.bud-tbl td{border:1px solid var(--line-d);padding:6px 9px;vertical-align:middle}
.bud-tbl th{background:var(--pink-xl);color:var(--pink-d);font-weight:600;text-align:left}
.bud-tbl td input{border:1px solid var(--line-d);background:#fff;padding:6px 8px;font-size:13.5px;width:100%;border-radius:7px}
.bud-tbl td input:disabled{background:#f6eef1;color:var(--ink)}
.bud-tbl td input:focus{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-l)}
.bud-tbl .bud-head td{background:#faedf3;font-weight:600}
.bud-tbl .bud-cat td{background:#fdf6fa;font-weight:600}
.bud-tbl .bud-total td{background:var(--pink-l);font-weight:700}
.bud-tbl .bud-net td{background:#eef6f0;font-weight:700;color:#1f7a4d}
.bud-tbl .bud-no{display:inline-block;width:34px;color:var(--muted);font-size:12.5px;vertical-align:middle}
.gantt th.c,.gantt td.c{text-align:center;padding:5px 3px}
.gantt-cell{cursor:pointer;min-width:30px;color:var(--pink-d);font-weight:700}
.gantt-cell.on{background:var(--pink-l)}
.gantt-cell:hover{background:var(--pink-xl)}
.tl-box{padding:6px 2px}
.tl-row{display:flex;gap:12px;align-items:baseline;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.tl-row:last-child{border-bottom:0}
.tl-b{flex-shrink:0;min-width:120px;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--pink-l);color:var(--pink-d);text-align:center}
.tl-b.tl-approve{background:#e7eef9;color:#2c5aa0}
.tl-b.tl-now{background:var(--green-l);color:var(--green)}
.tl-row.tl-cur{font-weight:600;background:#f5fbf7;border-radius:8px;margin-top:3px}
.notif-btn{position:fixed;bottom:20px;right:18px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(178,58,106,.28)}
.steps{display:flex;flex-direction:column;gap:9px}
.sp-row{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sp-row.sp-ok{background:#f4fbf7;border-color:#bfe6d0}
.sp-n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-family:'Sarabun';font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.sp-row.sp-ok .sp-n{background:var(--green,#2f9e63);color:#fff}
.sp-body{flex:1;min-width:0}
.sp-t{font-family:'Sarabun';font-weight:600;font-size:14px;color:#4a2338;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp-when{font-family:'Sarabun';font-weight:400;font-size:12.5px;color:#2f9e63;background:#eaf7f0;border-radius:999px;padding:1px 9px}
.sp-in{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.sp-in input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:'Sarabun';font-size:13.5px;flex:1;min-width:110px}
.sp-confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.sp-cur{font-size:13px;color:#5f4b56}.sp-cur b{color:var(--pink-d)}
.sp-empty{color:#b26a1a;font-size:12.5px}
.sp-hintline{font-size:12px;color:#b26a1a;margin-top:5px}
.sp-val{margin-top:5px;font-size:13.5px;color:#3a6d52}
.sp-wait{margin-top:5px;font-size:13px;color:var(--muted)}
.sp-lock{margin-top:5px;font-size:13px;color:#8a5a10;background:#fdf6e9;border-radius:8px;padding:6px 10px}
.sp-hint{margin-top:10px;font-size:12.5px;color:#8a5a10;background:#fdf6e9;border-radius:8px;padding:8px 12px}
.notif-btn #notifDot{display:none;position:absolute;top:-4px;right:-4px;background:var(--red,#d64060);color:#fff;font-size:12.5px;font-weight:700;min-width:19px;height:19px;border-radius:999px;align-items:center;justify-content:center;padding:0 4px}
.nf-item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
.nf-item.unread{background:#fff7fb;border-left:4px solid var(--pink)}
.nf-item .nf-h{font-weight:700;font-size:14px;color:var(--ink)}
.nf-item .nf-b{font-size:13px;color:#5f4b56;margin-top:4px;line-height:1.6}
.nf-item .nf-t{font-size:12.5px;color:var(--muted);margin-top:5px}
.nf-mail{font-size:12px;margin-top:6px;border-radius:8px;padding:5px 9px;display:inline-block}
.nf-mail.ok{background:#eaf7f0;color:#2f7d54}
.nf-mail.bad{background:#fdeaef;color:#b23a6a}
.nf-mail.wait{background:#fff7ed;color:#b26a1a;display:block}
.nf-mail a{color:var(--pink-d);font-weight:600}
@media print{.notif-btn,.help-btn{display:none!important}}
.help-btn{position:fixed;bottom:20px;right:76px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(120,30,70,.14);font:800 22px 'Sarabun',sans-serif;color:var(--pink-d)}
.help-btn:hover{background:var(--pink-xl)}
.pnav{display:flex;justify-content:flex-end;margin:20px 0 70px;padding-top:14px;border-top:1.5px solid var(--line)}
.pact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:12px}
.pact-l,.pact-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pact-r{margin-left:auto;justify-content:flex-end}
.pact-st{font-size:13px;font-weight:600}.pact-st.warn{color:#b26a1a}.pact-st.ok{color:#2f7d54}
.home-h{margin:2px 0 14px}.home-h h1{font-size:26px;color:var(--ink);margin:0}.home-h .desc{font-size:14px;color:var(--ink);margin-top:2px}
.home-sec{margin-bottom:18px}.home-sec h2{font-size:17px;color:var(--pink-d);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.home-sec .cnt{background:var(--pink-d);color:#fff;border-radius:999px;font-size:13px;padding:1px 10px}
.tk{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:#fff;border:1.5px solid #e6c9d6;border-left:6px solid var(--pink-d);border-radius:12px;padding:13px 16px;margin-bottom:9px;box-shadow:var(--shadow)}
.tk.warn{border-left-color:#d08a1c}.tk.bad{border-left-color:#c62828}
.tk-w{font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.35}.tk-s{font-size:13.5px;color:var(--ink);margin-top:3px}
.tk-a{font-size:13px;font-weight:700;color:var(--ink);background:#f6eef2;border-radius:999px;padding:3px 11px;white-space:nowrap}.tk.bad .tk-a{background:#fdecee;color:#8a1020}.tk.warn .tk-a{background:#fff3df;color:#6e4405}
.tk-go{font-size:15px;padding:10px 18px}
.tk-empty{background:#f1f8f3;border:1.5px solid #bfe0c9;border-radius:12px;padding:16px;font-size:15px;color:#14532d;font-weight:600}
.qas{display:flex;flex-wrap:wrap;gap:10px}.qa{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e6c9d6;border-radius:12px;padding:12px 18px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.qa:hover{border-color:var(--pink-d);background:#fff6fa}.qa b{background:var(--pink-d);color:#fff;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.dash-more{border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:6px}.dash-more>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:15px;color:var(--ink)}
.dash-more[open]>summary{border-bottom:1.5px solid var(--line)}.dash-more-b{padding:14px 16px}
.nb{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f7f4f6;border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:12px}

label{font-size:13px;font-weight:500;color:var(--ink)}
label .req{color:var(--pink)}
label .hint{display:block;color:var(--muted);font-weight:400;font-size:12px;line-height:1.35;margin-top:2px;white-space:normal;word-break:break-word}
.fld label{display:block;word-break:break-word}
.fld input,.fld select,.fld textarea{max-width:100%}
.fsec,.form-card,.panel{overflow-wrap:anywhere}
input,select,textarea{font-family:'Sarabun';font-size:14px;padding:9px 11px;border:1.5px solid var(--line-d);border-radius:9px;background:#fff;color:var(--ink);transition:.15s;width:100%}
textarea{min-height:60px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-l)}
input.money{text-align:right;font-family:'Sarabun';font-weight:500}
.foot-bar{padding:16px 22px;background:var(--pink-xl);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:'Sarabun';font-weight:600;font-size:14px;padding:10px 20px;border-radius:10px;border:0;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:#c2457a;color:#fff;box-shadow:0 4px 14px rgba(216,27,96,.28)}
.btn.primary:hover{background:var(--pink-d)}
.btn.ghost{background:#fff;color:var(--pink-d);border:1.5px solid var(--line-d)}
.btn.ghost:hover{border-color:var(--pink);background:var(--pink-xl)}
.btn.sm{padding:7px 13px;font-size:13px}
.err-msg{color:var(--red);font-size:12px;margin-top:3px;display:none}
.fld.bad input,.fld.bad select{border-color:var(--red)}
.fld.bad .err-msg{display:block}

/* Search/select */
.searchbox{position:relative;display:flex;align-items:center;gap:8px}
/* autocomplete project picker */
.ac{position:relative;display:flex;align-items:center;width:100%}
.ac .si{position:absolute;left:12px;color:var(--muted);font-size:14px;pointer-events:none;z-index:1}
.ac-input{padding-left:36px!important;width:100%}
.ac-list{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid var(--line-d);border-radius:13px;box-shadow:0 10px 34px rgba(120,30,70,.16);max-height:320px;overflow-y:auto;z-index:60;display:none;padding:5px}
.ac-list.show{display:block}
.ac-item{padding:10px 12px;font-size:13.5px;cursor:pointer;border-radius:9px;display:flex;gap:9px;align-items:baseline;line-height:1.35}
.ac-item:hover,.ac-item.hl{background:var(--pink-xl)}
.ac-item b{font-family:'Sarabun';font-weight:600;color:var(--pink-d);font-variant-numeric:tabular-nums;flex-shrink:0}
.ac-item span{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-empty{padding:14px 12px;color:var(--muted);font-size:13px;text-align:center}
.searchbox input{padding-left:34px}
.searchbox .si{position:absolute;left:11px;color:var(--muted);font-size:14px}

/* Registry detail */
.reg-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.reg-grid.g3{grid-template-columns:repeat(3,1fr)}
.reg-grid.g3 .ri:nth-child(odd){border-right:0}
.reg-grid.g3 .ri:not(:nth-child(3n)){border-right:1px solid var(--line)}
.reg-grid .ri{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.reg-grid .ri:nth-child(odd){border-right:1px solid var(--line)}
.ri .k{font-size:12px;color:var(--muted)} .ri .v{font-size:14.5px;font-weight:500}
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
.fin-row .v{font-family:'Sarabun';font-weight:500}
.fin-row.total{background:var(--pink-xl);font-weight:700} .fin-row.total .v{color:var(--pink-d);font-size:16px}
.checklist .ci{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
.checklist .ci{margin:6px 12px;border:1px solid var(--line);border-left-width:4px;border-radius:9px;font-weight:500}
.checklist .ci.ci-g{background:var(--green-l);border-color:var(--green)}
.checklist .ci.ci-r{background:var(--red-l);border-color:var(--red)}
.checklist .ci.ci-a{background:var(--amber-l);border-color:var(--amber)}
.checklist .ci.ci-g .ck{background:var(--green)} .checklist .ci.ci-r .ck{background:var(--red)} .checklist .ci.ci-a .ck{background:var(--amber)}
.checklist .dot{width:9px;height:9px;border-radius:99px;flex-shrink:0}
.dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.a{background:var(--amber)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:99;display:flex;align-items:center;gap:9px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:var(--green)} .toast.bad{background:var(--red)}
.tag-warn{background:var(--amber-l);color:var(--amber);border:1px solid #f0d8a0;padding:9px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}

.menu-toggle{display:none}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:fixed;left:0;top:0;width:230px;transform:translateX(-100%);transition:.25s;z-index:50;height:100vh;overflow-y:auto}
  .side.open{transform:translateX(0)}
  .main{padding:18px 16px 60px}
  .menu-toggle{display:inline-flex;position:fixed;top:14px;right:14px;z-index:40;background:var(--pink);color:#fff;border:0;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
  .grid2,.grid3{grid-template-columns:1fr}
  .reg-grid{grid-template-columns:1fr}
  .rh2-right{width:100%;flex-wrap:wrap}.rh2-right .btn{flex:1 1 auto;justify-content:center}
  .reg-grid.g3{grid-template-columns:1fr}
  .reg-grid.g3 .ri:not(:nth-child(3n)){border-right:0}
  .reg-grid .ri:nth-child(odd){border-right:0}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:45;display:none}.scrim.show{display:block}
}
.print-only{display:none}
.print-header{align-items:center;gap:14px;border-bottom:2.5px solid var(--pink);padding-bottom:11px;margin-bottom:16px}
.print-header img{height:36px;width:auto}
.print-header .pt{font-family:'Sarabun';font-weight:600;font-size:15px;color:var(--pink-d);line-height:1.3}
.print-header .ps{font-size:12.5px;color:#333}
.print-header .pd{margin-left:auto;font-size:12.5px;color:#333;text-align:right;white-space:nowrap}
@media print{
  body{--muted:#1c1c1c;background:#fff;font-size:12.5px;color:#000}
  .side,.menu-toggle,.foot-bar,.no-print,.head{display:none!important}
  .app,.main{display:block;padding:0}
  .panel,.form-card{box-shadow:none;border:1px solid #b8b8b8}
  .reg-head2{box-shadow:none;border:1px solid #b8b8b8;break-inside:avoid}
  .ri .v,.ri .k,.fin-row,.fin-row .v,td,th,.checklist .ci,.checklist span,.rh2-name,.rh2-facts span,.rh2-prog .lbl span,.net-box .nl{color:#000!important}
  .reg-cols{grid-template-columns:1fr!important;gap:12px!important;align-items:start}
  .reg-grid{grid-template-columns:1fr 1fr!important}
  .reg-grid .ri{padding:6px 12px!important}
  .checklist .ci{margin:4px 10px!important;padding:6px 12px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .reg-cols .panel{break-inside:auto}
  .reg-grid .ri,.checklist,.checklist .ci,.fin-row,.net-box,.rn-item{break-inside:avoid}
  .reg-break{break-before:page}
  .tbl-wrap,table{break-inside:auto}
  .reg-head2{border-left:4px solid var(--pink)}
  .print-only{display:flex!important}
  .rh2-prog .bar i,.net-box,.ck.g,.ck.r,.ck.a,.pill,.print-header img,.reg-head2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:18mm 16mm}
}
</style>
</head>

function sha256(ascii){function R(v,a){return (v>>>a)|(v<<(32-a));}var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length,isComposite={};for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(var i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);for(var j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);for(var i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],temp1=hash[7]+(R(e,6)^R(e,11)^R(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(R(w15,7)^R(w15,18)^(w15>>>3))+w[i-7]+(R(w2,17)^R(w2,19)^(w2>>>10)))|0),temp2=(R(a,2)^R(a,13)^R(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;}for(var i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;}for(var i=0;i<8;i++){for(var j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}return result;}

/* ตรวจความถูกต้องของ Activity Log (ห่วงโซ่แฮช) */
function verifyLog(){
  const L=DB.meta.log||[];let legacy=0,checked=0,bad=-1;
  for(let i=L.length-1;i>=0;i--){
    const e=L[i];
    if(!e.h){legacy++;continue;}
    checked++;
    if(logEntryHash(e)!==e.h){bad=i;break;}
    const older=L[i+1];
    if(older&&older.h&&e.p!==older.h){bad=i;break;}
  }
  return {ok:bad<0,bad:bad,checked:checked,legacy:legacy,total:L.length};
}

function personMatch(v,u){if(!v||!u)return false;const ids=[u.email,u.name,u.headName,u.coordName,u.vetName].concat((''+(u.aliases||'')).split(',')).map(x=>(''+(x||'')).trim()).filter(Boolean).map(x=>(''+x).trim().toLowerCase());const s=(''+v).trim().toLowerCase();const pp=splitPerson(v);return ids.includes(s)||(pp.name&&ids.includes(pp.name.toLowerCase()))||(pp.email&&ids.includes(pp.email.toLowerCase()));}
function isHeadOf(p){return !!(p&&CURRENT_USER&&(personMatch(p.head,CURRENT_USER)||(p.headUser&&(''+p.headUser).toLowerCase()===(''+CURRENT_USER.email).toLowerCase())));}
function isCoordOf(p){return !!(p&&CURRENT_USER&&personMatch(p.coordinator,CURRENT_USER));}
function isVetOf(p){return !!(p&&CURRENT_USER&&personMatch(p.vet,CURRENT_USER));}
function projRolesOf(u){const out=[];(DB.projects||[]).forEach(p=>{if(String(p.status||'').indexOf('ปิดแล้ว')===0)return;if(personMatch(p.head,u))out.push({no:p.projNo,role:'หัวหน้าโครงการ'});if(personMatch(p.coordinator,u))out.push({no:p.projNo,role:'ผู้ประสานงาน'});if(personMatch(p.vet,u))out.push({no:p.projNo,role:'สัตวแพทย์'});});return out;}
const NAV={
  admin:['dash','proposal','open','fin','reg','ledger','bank','settings'],
  finance:['dash','proposal','fin','reg','ledger','bank'],

};
function can(cap){
  if(ROLE==='admin')return true;
  switch(cap){
    case 'record': return ROLE==='finance'||ROLE==='staff';   // เมนูบันทึกรับ-จ่าย · สิทธิ์จริงตรวจรายโครงการด้วย canRecord(p)
    case 'amend': return false;                              // ขยายเวลา/แก้ไข = ผู้พัฒนาเท่านั้น
    case 'editProject': return ROLE==='finance'||ROLE==='policy';
    case 'proposal': return true;                            // ทุกคนเขียนโครงการของตนได้ (รวมสัตวแพทย์)
    case 'newProject': return false;                         // เปิดโครงการใหม่ = หัวหน้างานเท่านั้น
    case 'admin': return false;
    default: return false;
  }
}
function canEditSec(n){ return true; }                     // ฟอร์มเปิดโครงการ = ข้อมูลโครงการทั่วไป (CUERP/บัญชี ย้ายไปทะเบียนแล้ว)
function splitPerson(v){v=(''+(v||'')).trim();const i=v.indexOf(' — ');if(i>=0)return {name:v.slice(0,i).trim(),email:v.slice(i+3).trim()};if(/@/.test(v))return {name:'',email:v};return {name:v,email:''};}
function personName(v){const p=splitPerson(v);return p.name||p.email||'';}
function myIdentifiers(){const u=CURRENT_USER||{};return [u.headName,u.coordName,u.vetName,u.name,u.email].filter(Boolean).map(x=>(''+x).trim().toLowerCase());}
function involvedIn(p){const ids=myIdentifiers();if(!ids.length)return false;return [p.head,p.coordinator,p.vet].filter(Boolean).some(v=>{const pp=splitPerson(v);return ids.includes((''+v).trim().toLowerCase())||(pp.name&&ids.includes(pp.name.toLowerCase()))||(pp.email&&ids.includes(pp.email.toLowerCase()));});}
function scopeProjects(list){                               // แผน/การเงิน/ผู้พัฒนา/ผู้บริหาร เห็นทุกโครงการ · หัวหน้าโครงการ/ผู้ประสานงาน/สัตวแพทย์ เห็นเฉพาะโครงการที่ตนมีบทบาท
  if(ROLE==='admin'||ROLE==='finance'||ROLE==='policy'||ROLE==='exec')return list;
  return list.filter(p=>isHeadOf(p)||isCoordOf(p)||isVetOf(p)||involvedIn(p));
}
function canRecord(p){return !!p&&(ROLE==='admin'||ROLE==='finance'||isHeadOf(p)||isCoordOf(p));}      // บันทึกรับ-จ่าย: การเงิน + หัวหน้า/ผู้ประสานงานของโครงการนั้น (สัตวแพทย์ดูอย่างเดียว)
function isClosed(p){return String((p&&p.status)||'').indexOf('ปิดแล้ว')===0;}
function canView(no){const p=DB.projects.find(x=>x.projNo===no);if(!p)return false;return scopeProjects([p]).length>0;}
function fmt(n){n=Math.round(n||0);return n.toLocaleString('en-US');}
function fmt2(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return '';s=''+s;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m){const y=(+m[1]+543)%100;return (+m[3])+' '+THMON[+m[2]-1]+' '+String(y).padStart(2,'0');}return s;}
function esc(s){return (s==null?'':''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeNo(s){return (''+(s==null?'':s)).replace(/['"`\\<>&\s]/g,'').slice(0,40);}          // เลขที่โครงการ: ตัดอักขระที่ใช้ฝังสคริปต์ได้
function safeUrl(u){u=(''+(u||'')).trim();return /^https?:\/\//i.test(u)?u:'';}

function acKey(e,id){
  const list=document.getElementById(id+'_list');
  if(e.key==='Enter'){e.preventDefault();const it=list.querySelector('.ac-item.hl')||list.querySelector('.ac-item');if(it)it.dispatchEvent(new MouseEvent('mousedown'));}
  else if(e.key==='Escape'){list.classList.remove('show');}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const items=[...list.querySelectorAll('.ac-item')];if(!items.length)return;let i=items.findIndex(x=>x.classList.contains('hl'));items.forEach(x=>x.classList.remove('hl'));i=e.key==='ArrowDown'?Math.min(items.length-1,i+1):Math.max(0,i-1);if(i<0)i=0;items[i].classList.add('hl');items[i].scrollIntoView({block:'nearest'});}
}

/* ---- computations ---- */
function tx(projNo){return DB.ledger.filter(x=>x.projNo===projNo);}
function calc(p){
  const L=tx(p.projNo);
  const received=L.filter(x=>x.type==='รับโอนจาก Sponsor').reduce((s,x)=>s+(+x.in||0),0);
  const borrowed=L.filter(x=>x.type==='ยืมเงินรองจ่าย').reduce((s,x)=>s+(+x.out||0),0);
  const returned=L.filter(x=>x.type==='คืนเงินยืม').reduce((s,x)=>s+(+x.in||0),0);
  const spent=L.filter(x=>x.type==='ค่าใช้จ่ายดำเนินงาน').reduce((s,x)=>s+(+x.out||0),0);
  const util=(+p.estRevenue||0)*0.05, subsidy=(+p.estRevenue||0)*0.10;
  const utilPaid=L.filter(x=>x.type==='ชำระค่าสาธารณูปโภค ศสท.').reduce((s,x)=>s+(+x.out||0),0);
  const subPaid=L.filter(x=>x.type==='ชำระเงินอุดหนุน ศสท.').reduce((s,x)=>s+(+x.out||0),0);
  const pct=p.estRevenue? received/p.estRevenue:0;
  const net=received-(borrowed-returned)-util-subsidy;
  return {received,borrowed,returned,spent,util,subsidy,utilPaid,subPaid,pct,net,n:L.length};
}

  const no=p.projNo;what=String(what||'');

  if(/คำขอเปลี่ยนแปลงเข้าคณะกรรมการ/.test(what)){const i=(p.changeReqs||[]).findIndex(r=>r.status==='รออนุมัติ');return ()=>{go('reg',no);openRenew(no,i<0?0:i);};}
  if(/กดปิดโครงการ/.test(what))return ()=>{go('reg',no);closeProject(no);};
  if(/ขึ้นงบใน CUERP/.test(what))return ()=>{go('reg',no);openCuerp(no);};
  if(/Vendor|บัญชีธนาคาร|ใบแจ้งหนี้/.test(what))return ()=>{go('reg',no);focusPanel(/สถานะการดำเนินการ/,true);};
  if(/แต่งตั้งผู้ประสานงาน/.test(what))return ()=>{go('reg',no);assignCoord(no);};
  if(/บันทึกรับ-จ่าย/.test(what))return ()=>{FIN_PROJ=no;go('fin');};
  if(/ขอปิดโครงการ/.test(what)&&isHeadOf(p))return ()=>{go('reg',no);askClose(no);};
  return ()=>go('reg',no);
}

/* โครงการที่ต้องติดตาม: เกินกำหนดสิ้นสุด / ไม่มีความเคลื่อนไหวเกิน 30 วัน */
function dashWatch(P){
  const now=Date.now(),DAY=86400000,items=[];
  (P||[]).forEach(p=>{
    if(String(p.status||'').indexOf('ปิดแล้ว')===0)return;
    let last=null;try{const E=projTimeline(p);last=E.length?E[E.length-1].at:null;}catch(e){}
    const end=p.endDate?Date.parse(p.endDate):NaN;
    const reasons=[];
    if(!isNaN(end)&&end<now)reasons.push('เกินกำหนดสิ้นสุด '+Math.round((now-end)/DAY)+' วัน');
    if(last!=null){const lt=(last instanceof Date)?last.getTime():+last;if(isFinite(lt)&&lt>946684800000&&now-lt>30*DAY)reasons.push('ไม่มีความเคลื่อนไหว '+Math.round((now-lt)/DAY)+' วัน');}   // v24: กันค่าวันที่ผิดรูปแบบ
    if(reasons.length){let ns=null;try{ns=nextStepHint(p);}catch(e){}items.push({p:p,r:reasons.join(' · '),ns:ns,od:!isNaN(end)&&end<now});}
  });
  items.sort((a,b)=>(b.od-a.od));
  const canLog=(ROLE==='admin'||ROLE==='exec');
  const rows=items.slice(0,12).map(x=>`<tr class="clk" onclick="go('reg','${esc(x.p.projNo)}')">
     <td class="nowrap tnum">${esc(x.p.projNo)}</td><td>${esc(x.p.shortName||x.p.fullName)}</td>
     <td><span style="color:${x.od?'#8a1616':'#8a5a10'};font-weight:600">${esc(x.r)}</span></td>
     <td>${x.ns?'<b>'+esc(x.ns.who)+'</b> — '+esc(x.ns.what):'—'}</td></tr>`).join('');
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>โครงการที่ต้องติดตาม</h2>
    <div style="display:flex;gap:8px;align-items:center"><span style="font-size:12.5px;color:var(--muted)">${items.length} โครงการ</span>
</div></div>
    ${items.length?`<div class="tbl-wrap"><table><thead><tr><th style="width:12%">เลขที่</th><th>ชื่อโครงการ</th><th style="width:27%">สาเหตุ</th><th style="width:30%">ค้างที่</th></tr></thead><tbody>${rows}</tbody></table></div>`
      :'<div class="empty" style="padding:18px">ไม่มีโครงการค้างหรือเกินกำหนด</div>'}
  </div>`;
}

function readPdf(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){toast('กรุณาเลือกไฟล์ PDF','bad');input.value='';return;}
  if(f.size>3*1024*1024){toast('ไฟล์ใหญ่เกิน 3 MB — กรุณาลดขนาดก่อน','bad');input.value='';return;}
  const r=new FileReader();
  r.onload=()=>{PENDING_PDF={name:f.name,data:r.result};document.getElementById('pdfInfo').innerHTML=`เลือกไฟล์: ${esc(f.name)}<span style="color:var(--red);cursor:pointer;margin-left:8px;text-decoration:underline" onclick="removePdf()">ลบไฟล์</span>`;};
  r.readAsDataURL(f);
}

function viewPdf(no){
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return;
  if(safeUrl(p.pdfUrl)){window.open(safeUrl(p.pdfUrl),'_blank','noopener');return;}
  if(!p.pdfData)return;
  try{const b=p.pdfData.split(',')[1],bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);

}

    PENDING_PDF=undefined;DB.projects.push(data);save();toast('บันทึกโครงการ '+projNo+' แล้ว','ok');go('reg',projNo);
  }

function stepDone(p,k){return !!(p.steps&&p.steps[k]&&p.steps[k].done);}
function stepMeta(p,k){const s=(p.steps&&p.steps[k])||{};return s.at?`<span class="sp-when">${esc(s.byName||s.by||'')} · ${new Date(s.at).toLocaleString('th-TH')}</span>`:'';}

function tlDays(a,b){ if(!a||!b)return null; const d=Math.round((b-a)/86400000); return d<0?0:d; }
function tlDate(v){ if(!v)return null; if(typeof v==='number')return v; const t=Date.parse(v); return isNaN(t)?null:t; }
function projTimeline(p){
  const E=[],st=p.steps||{};
  const push=(at,title,who,detail,key)=>{ if(at==null)return; E.push({at:at,title:title,who:who||'',detail:detail||'',key:key||''}); };
  push(tlDate(p.approveDate),'อนุมัติโครงการ','หัวหน้างาน',(p.meetingNo?'มติคณะกรรมการบริหาร ครั้งที่ '+esc(p.meetingNo):''),'approve');
  if(st.vendor&&st.vendor.done)push(st.vendor.at,'ได้เลข Vendor','การเงิน'+(st.vendor.byName?' — '+esc(st.vendor.byName):''),(p.vendorId?'เลข Vendor '+esc(p.vendorId):''),'vendor');
  if(st.bank&&st.bank.done)push(st.bank.at,'เปิดบัญชีธนาคาร','การเงิน'+(st.bank.byName?' — '+esc(st.bank.byName):''),[esc(p.bank),esc(p.branch),esc(p.bankAccount)].filter(Boolean).join(' · '),'bank');
  if(st.cuerp&&st.cuerp.done)push(st.cuerp.at,'ขึ้นงบประมาณในระบบ CUERP','นโยบายและแผน'+(st.cuerp.byName?' — '+esc(st.cuerp.byName):''),(p.costCenter?'ศูนย์ต้นทุน '+esc(p.costCenter):''),'cuerp');
  if(st.invoice&&st.invoice.done)push(st.invoice.at,'ออกใบแจ้งหนี้','หัวหน้างาน'+(st.invoice.byName?' — '+esc(st.invoice.byName):''),(p.invoiceNo?'เลขที่ '+esc(p.invoiceNo):''),'invoice');
  (tx(p.projNo)||[]).filter(t=>t.type==='รับโอนจาก Sponsor').forEach(t=>push(tlDate(t.date),'รับเงินเข้าบัญชีโครงการ','การเงิน',fmt2(+t.in||0)+' บาท','money'));
  (p.changeReqs||[]).forEach(r=>push(r.at,'คำขอ'+esc(r.type||'เปลี่ยนแปลง'),'หัวหน้าโครงการ'+(r.by?' — '+esc(r.by):''),esc(r.detail||''),'req'));
  (p.renewals||[]).forEach(r=>{
    const lab=[r.newPeriod?'ขยายเวลาโครงการ':'',(r.newRevenue!=null&&r.newRevenue!==r.oldRevenue)||(r.newExpense!=null&&r.newExpense!==r.oldExpense)?'ปรับงบประมาณ':'',r.newDisburse&&r.newDisburse!==r.oldDisburse?'ขยายเวลาเบิกจ่าย':''].filter(Boolean).join(' + ')||'แก้ไขโครงการ';
    push(tlDate(r.date),'อนุมัติ'+lab,'หัวหน้างาน',(r.meetingNo?'มติ คก. ครั้งที่ '+esc(r.meetingNo):''),'renew');
  });
  (p.cuerpLog||[]).forEach(r=>push(r.at,'ดำเนินการใน CUERP แล้ว','นโยบายและแผน'+(r.by?' — '+esc(r.by):''),esc(r.label||''),'cuerpdone'));
  const ci=p.closeInfo||{};
  if(ci.askAt)push(ci.askAt,'ขอปิดโครงการ','หัวหน้าโครงการ'+(ci.askBy?' — '+esc(ci.askBy):''),'','askclose');
  if(ci.date||ci.closedAt)push(tlDate(ci.date)||ci.closedAt,'ปิดโครงการ','หัวหน้างาน'+(ci.byName?' — '+esc(ci.byName):''),(ci.meetingNo?'มติ คก. ครั้งที่ '+esc(ci.meetingNo):''),'close');
  E.sort((a,b)=>a.at-b.at);
  return E;
}
function nextStepHint(p){
  const st=p.steps||{};
  if(String(p.status||'').indexOf('ปิดแล้ว')===0)return null;
  if(p.pendingCuerp)return {who:'นโยบายและแผน',what:'ดำเนินการในระบบ CUERP แล้วกดยืนยัน'};
  if((p.changeReqs||[]).some(r=>r.status==='รออนุมัติ'))return {who:'หัวหน้างาน',what:'นำคำขอเปลี่ยนแปลงเข้าคณะกรรมการและบันทึกมติ (ทีละคำขอ)'};
  if(String(p.status||'').indexOf('รอปิด')===0)return {who:'หัวหน้างาน',what:'พิมพ์รายงานผล เสนอคณะกรรมการ และกดปิดโครงการ'};
  if(!(st.vendor&&st.vendor.done))return {who:'การเงิน',what:'ขอเลข Vendor และบันทึกในระบบ'};
  if(!(st.bank&&st.bank.done))return {who:'การเงิน',what:'เปิดบัญชีธนาคารและบันทึกในระบบ'};
  if(!(st.cuerp&&st.cuerp.done))return {who:'นโยบายและแผน',what:'ขอชุดงบประมาณและขึ้นงบใน CUERP'};
  if(!(st.invoice&&st.invoice.done))return {who:'หัวหน้างาน',what:'จัดทำใบแจ้งหนี้และบันทึกเลขที่ในระบบ'};
  if(!p.coordinator)return {who:'หัวหน้าโครงการ',what:'แต่งตั้งผู้ประสานงานและสัตวแพทย์'};
  return {who:'ผู้ประสานงาน',what:'บันทึกรับ-จ่ายตามหมวดงบประมาณระหว่างดำเนินโครงการ'};
}

function timelineBox(p){
  const E=projTimeline(p);
  const ns=nextStepHint(p);
  const COL={approve:'#e8a020',vendor:'#1d7fd4',bank:'#1d7fd4',cuerp:'#1d9e75',invoice:'#e8a020',money:'#1d9e75',req:'#e11d6b',renew:'#e8a020',cuerpdone:'#1d9e75',askclose:'#e11d6b',close:'#5a6b8a'};
  let rows='';
  E.forEach((e,i)=>{
    const prev=i>0?E[i-1].at:null, gap=tlDays(prev,e.at);

    rows+='<div class="tl-i">'
      +'<div class="tl-dot" style="background:'+c+'"></div>'
      +'<div class="tl-c">'
      +'<div class="tl-h"><b>'+e.title+'</b><span class="tl-d">'+fmtDate(new Date(e.at).toISOString().slice(0,10))+'</span></div>'

      +'</div></div>';
  });
  if(!E.length)rows='<div class="tl-empty">ยังไม่มีเหตุการณ์ในโครงการนี้</div>';

    :(canFin?`<div class="sp-in"><input id="st_vendor" placeholder="กรอกเลข Vendor" value="${esc(p.vendorId)||''}"><button class="btn primary sm" onclick="saveStep('${esc(p.projNo)}','vendor')">✓ บันทึก + แจ้งแผน</button></div>`

  // ② บัญชีธนาคาร (การเงิน) — กรอกในตัว
  const s2=bDone?`<div class="sp-val">บัญชี:<b>${esc(p.bankAccount)||'—'}</b>· ${esc(p.bank)||''}${p.branch?' สาขา'+esc(p.branch):''}${p.bankName?' · ชื่อบัญชี: '+esc(p.bankName):''}</div>`
    :(canFin?`<div class="sp-in" style="flex-wrap:wrap"><input id="st_bank" placeholder="ธนาคาร" value="${esc(p.bank)||''}" style="max-width:150px"><input id="st_branch" placeholder="สาขา" value="${esc(p.branch)||''}" style="max-width:150px"><input id="st_bankname" placeholder="ชื่อบัญชี" value="${esc(p.bankName)||''}" style="min-width:210px;flex:1"><input id="st_bankacc" placeholder="เลขที่บัญชี" value="${esc(p.bankAccount)||''}" style="max-width:180px"><button class="btn primary sm" onclick="saveStep('${esc(p.projNo)}','bank')">✓ บันทึก</button></div>`
      :`<div class="sp-wait">รอเจ้าหน้าที่การเงินเปิดบัญชีธนาคาร</div>`);
  // ③ ชุดงบ CUERP (แผน) — กรอกครบทุกช่องในหน้าต่าง · ต้องมี Vendor ก่อน

  return `<div class="panel no-print"><div class="panel-h"><h2>สถานะการดำเนินการ (หลังอนุมัติ)</h2></div>

      ${row(1,'','ขอเลข Vendor (การเงิน)',vDone,s1)}
      ${row(2,'','เปิดบัญชีธนาคาร (การเงิน)',bDone,s2)}
      ${row(3,'','ขอเลขชุดงบประมาณ + ขึ้น CUERP (แผน)',cDone,s3)}
      ${row(4,'','ออก Invoice เรียกเก็บ Sponsor (หัวหน้างาน)',iDone,s4)}
</div>
    ${!cDone?`<div class="sp-hint">บันทึกรับเงินในระบบได้ หลังแผนขึ้นงบ CUERP (ขั้น ③) แล้ว</div>`:''}

function saveCuerp(no){
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return;
  if(ROLE!=='policy'&&ROLE!=='admin'){toast('เฉพาะเจ้าหน้าที่นโยบายและแผน','bad');return;}
  if(!stepDone(p,'vendor')){toast('ต้องมีเลข Vendor ก่อน','bad');return;}
  const g=id=>(document.getElementById(id).value||'').trim();
  p.businessType=g('cu_bcode');p.businessName=g('cu_bname');
  p.costCenter=g('cu_ccode');p.costName=g('cu_cname');
  p.fund=g('cu_fcode');p.fundName=g('cu_fname');
  p.dutyZone=g('cu_zcode');p.zoneName=g('cu_zname');
  if(!p.costCenter){toast('กรุณากรอกรหัสศูนย์ต้นทุน','bad');return;}
  const me=CURRENT_USER||{};
  p.steps=p.steps||{};p.steps.cuerp={done:true,by:me.email||'',byName:me.name||me.email||'',at:Date.now()};
  const msg='โครงการเลขที่ '+no+' แผนขึ้นงบประมาณในระบบ CUERP เรียบร้อย (ศูนย์ต้นทุน: '+p.costCenter+(p.costName?' '+p.costName:'')+') พร้อมออกใบ Invoice เรียกเก็บเงินจาก Sponsor';
  var _tc='โครงการเลขที่ '+no+' ขึ้นงบ CUERP แล้ว';
  notify('admin',_tc+' — พร้อมออกใบแจ้งหนี้',msg,no,mkMail('',_tc,msg,'admin'));
  if(p.head)notify(p.head,_tc,msg,no,mkMail(userEmailByName(p.head),_tc,msg));
  logAct('บันทึกข้อมูล CUERP + ยืนยันขั้น cuerp โครงการ '+no);save();closeModal();render(no);updNotifBell();toast('บันทึก CUERP + ยืนยันแล้ว · แจ้งเตือนแล้ว','ok');
}
function saveStep(no,key){
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return;
  if((key==='vendor'||key==='bank')&&ROLE!=='finance'&&ROLE!=='admin'){toast('เฉพาะเจ้าหน้าที่การเงิน','bad');return;}
  if(key==='invoice'&&ROLE!=='admin'){toast('เฉพาะหัวหน้างาน','bad');return;}
  p.steps=p.steps||{};
  const me=CURRENT_USER||{};const stamp={done:true,by:me.email||'',byName:me.name||me.email||'',at:Date.now()};
  if(key==='vendor'){
    const v=(((document.getElementById('st_vendor')||{}).value)||'').trim();if(!v){toast('กรอกเลข Vendor','bad');return;}
    p.vendorId=v;p.steps.vendor=stamp;
    notifyM('policy','โครงการเลขที่ '+no+' ได้เลข Vendor แล้ว — ขอเลขงบประมาณ + CUERP','โครงการเลขที่ '+no+' การเงินได้เลข Vendor แล้ว (Vendor: '+v+') กรุณาขอเลขชุดงบประมาณและขึ้นงบในระบบ CUERP',no);
  }else if(key==='bank'){
    const bk=(((document.getElementById('st_bank')||{}).value)||'').trim(), ac=(((document.getElementById('st_bankacc')||{}).value)||'').trim();
    const br=((document.getElementById('st_branch')||{}).value||'').trim(), an=((document.getElementById('st_bankname')||{}).value||'').trim();
    if(!ac){toast('กรอกเลขที่บัญชี','bad');return;}
    p.bank=bk;p.branch=br;p.bankName=an;p.bankAccount=ac;p.steps.bank=stamp;
    const msg='โครงการเลขที่ '+no+' เปิดบัญชีธนาคารแล้ว (บัญชี: '+ac+(bk?' ธนาคาร '+bk:'')+') พร้อมรับเงินเข้าบัญชี';
    var _tb='โครงการเลขที่ '+no+' เปิดบัญชีธนาคารแล้ว';
    if(p.head)notify(p.head,_tb,msg,no,mkMail(userEmailByName(p.head),_tb,msg));
    notify('admin',_tb,msg,no,mkMail('',_tb,msg,'admin'));
  }else if(key==='invoice'){
    if(!stepDone(p,'bank')){toast('ต้องเปิดบัญชีธนาคาร (ขั้น ②) ก่อน','bad');return;}
    if(!stepDone(p,'cuerp')){toast('ต้องขึ้นชุดงบประมาณ CUERP (ขั้น ③) ก่อนออกใบแจ้งหนี้','bad');return;}
    const iv=((document.getElementById('st_invno')||{}).value||'').trim(), dt=((document.getElementById('st_invdate')||{}).value||'').trim();
    if(!iv){toast('กรอกเลขที่ Invoice','bad');return;}
    p.steps.invoice={done:true,no:iv,date:dt,by:me.email||'',byName:me.name||'',at:Date.now()};
    var _im='โครงการเลขที่ '+no+' จัดทำใบแจ้งหนี้เลขที่ '+iv+' ตามใบเสนอราคา และส่งอีเมลให้ผู้สนับสนุนแล้ว'+(p.sponsorEmail?(' ('+p.sponsorEmail+')'):'');
    if(p.head)notify(p.head,'โครงการเลขที่ '+no+' ออกใบแจ้งหนี้แล้ว',_im,no);
    notify('finance','โครงการเลขที่ '+no+' ออกใบแจ้งหนี้แล้ว',_im+' — เมื่อรับเงินแล้วออกใบเสร็จส่งผู้สนับสนุน (cc ผู้ประสานงาน/หัวหน้าโครงการ)',no);
  }
  logAct('บันทึกขั้น '+key+' โครงการ '+no);save();render(no);updNotifBell();toast('บันทึกขั้นตอนแล้ว · แจ้งเตือนผู้เกี่ยวข้องแล้ว','ok');
}

/* ===== ค้นหาโครงการตามสถานะ ===== */
function propRev(b){
  try{
    if(!b||typeof b!=='object')return null;
    const arr=Array.isArray(b.rev)?b.rev:[];
    let t=0;arr.forEach(function(r){t+=bnum(r&&r.amount);});
    return t;
  }catch(e){return null;}
}
function regStatusKey(p){
  const st=String((p&&p.status)||'');
  if(st.indexOf('ปิดแล้ว')===0)return 'closed';
  if(st.indexOf('รอปิด')===0)return 'closing';
  return 'active';
}
function regList(){
  const q=(REGQ||'').trim().toLowerCase();
  const projs=(scopeProjects(DB.projects||[])||[]).filter(Boolean);
  const props=(scopeProposals(DB.proposals||[])||[]).filter(x=>x&&x.status==='ยื่นขออนุมัติ');
  const cnt={all:0,pending:props.length,active:0,closing:0,closed:0};
  projs.forEach(p=>{cnt[regStatusKey(p)]++;});
  cnt.all=projs.length+props.length;
  const TABS=[['','ทั้งหมด',cnt.all],['pending','ระหว่างขออนุมัติ',cnt.pending],['active','อยู่ระหว่างดำเนินการ',cnt.active],['closing','ระหว่างขอปิด',cnt.closing],['closed','ปิดแล้ว',cnt.closed]];
  const tabs=TABS.map(t=>`<button class="rf-tab${REGFILTER===t[0]?' on':''}" onclick="REGFILTER='${t[0]}';render()">${t[1]}<span class="rf-n">${t[2]}</span></button>`).join('');
  const hit=(s1)=>!q||String(s1||'').toLowerCase().indexOf(q)>=0;
  let rows='';
  if(REGFILTER===''||REGFILTER==='pending'){
    props.filter(x=>hit(x.projNo)||hit(x.projName)||hit(x.headName)).forEach(x=>{
      rows+=`<tr class="clk" onclick="go('proposal','${esc(x.id)}')">
        <td class="nowrap tnum">${esc(x.projNo)||'<span style="color:var(--muted)">—</span>'}</td>
        <td style="white-space:normal;line-height:1.45">${esc(x.projName)||'(ยังไม่ตั้งชื่อ)'}</td>
        <td>${esc(x.headName)}</td>
        <td class="r tnum">${(function(){const v=propRev(x.budget);return v==null?'—':fmt(v);})()}</td>
        <td class="c"><span class="pill pend">ระหว่างขออนุมัติ</span></td></tr>`;
    });
  }
  if(REGFILTER!=='pending'){
    projs.filter(p=>!REGFILTER||regStatusKey(p)===REGFILTER)
      .filter(p=>hit(p.projNo)||hit(p.fullName)||hit(p.shortName)||hit(p.head)||hit(p.coordinator)||hit(personName(p.coordinator)))
      .sort((a,b)=>String(b.projNo||'').localeCompare(String(a.projNo||'')))
      .forEach(p=>{
        const k=regStatusKey(p);let c;try{c=calc(p);}catch(e){c={received:0};}
        const lab={active:['อยู่ระหว่างดำเนินการ','act'],closing:['ระหว่างขอปิด','clo'],closed:['ปิดแล้ว','done']}[k];
        rows+=`<tr class="clk" onclick="go('reg','${esc(p.projNo)}')">
          <td class="nowrap tnum">${esc(p.projNo)}</td>
          <td style="white-space:normal;line-height:1.45">${esc(p.fullName||p.shortName)}</td>
          <td style="white-space:normal">${esc(personName(p.head)||p.head)}</td>
          <td class="r tnum nowrap">${fmt(c.received)}</td>
          <td class="c"><span class="pill ${lab[1]}">${lab[0]}</span></td></tr>`;
      });
  }
  return `<div class="panel">
    <div class="panel-h"><h2>ค้นหาโครงการตามสถานะ</h2>
      <div class="searchbox no-print"><span class="si"></span><input id="rq" placeholder="ค้นหา: เลขที่ · ชื่อ · หัวหน้าโครงการ · ผู้ประสานงาน" value="${esc(REGQ)}" oninput="REGQ=this.value;redrawReg(this)" style="min-width:250px"></div></div>
    <div class="rf-tabs no-print">${tabs}</div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:9%">เลขที่</th><th style="width:48%">ชื่อโครงการ</th><th style="width:17%">หัวหน้าโครงการ</th><th class="r" style="width:11%">รับแล้ว (บาท)</th><th class="c" style="width:15%">สถานะ</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5" class="empty">ไม่พบโครงการตามเงื่อนไข</td></tr>'}</tbody></table></div>
  </div>`;
}

  });
  const dif=function(a,b){const d=b-a;return (d===0?'—':(d>0?'+':'')+fmt2(d));};

    (bud.rev||[]).forEach(function(r,i){budTbl+=row4(esc(r.label||('รายรับ '+(i+1))),bnum(r.amount),(i===0?c.received:0),true);});
  }else{ budTbl+=row4('รายรับจากผู้สนับสนุน',estRev,c.received,true); }
  budTbl+='<tr class="rpt-tot"><td>รวมรายรับ</td><td class="r">'+fmt2(estRev)+'</td><td class="r">'+fmt2(c.received)+'</td></tr>';

  return `<table class="rpt-tbl"><tr><td style="width:32%">เลขที่โครงการ</td><td>${esc(p.projNo)}</td></tr>
<tr><td>ชื่อโครงการ</td><td>${esc(p.fullName)}</td></tr>

<table class="rpt-tbl">

<tr class="rpt-tot"><td>คงเหลือสุทธิ (นำส่งเป็นรายได้ส่วนงาน)</td><td class="r">${fmt2(c.received-actSpent)}</td></tr>
</table>
    ${ci.resultNote?`<h3 class="rpt-h3" style="font-family:Sarabun;color:#1f4b7a;margin:14px 0 6px;font-size:15px">ผลการดำเนินโครงการ</h3><div style="text-indent:2em;text-align:justify">${esc(ci.resultNote).replace(/\n/g,'<br>')}</div>`:''}`;

function saveReqDecision(no,ri){
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return;const r=(p.changeReqs||[])[ri];if(!r)return;
  if(ROLE!=='admin'){toast('เฉพาะหัวหน้างาน','bad');return;}
  if(r.status!=='รออนุมัติ'){toast('คำขอนี้บันทึกมติแล้ว','bad');closeModal();render(no);return;}
  const res=document.getElementById('rd_result').value, meet=document.getElementById('rn_meet').value.trim(), date=document.getElementById('rn_date').value.trim(), note=document.getElementById('rn_note').value.trim();
  if(!meet||!date){toast('กรอกครั้งที่ประชุมและวันที่ประชุม','bad');return;}
  const head=p.head||p.headName||'';
  if(res==='ไม่อนุมัติ'){
    r.status='ไม่อนุมัติ';r.decision={result:res,meetingNo:meet,date,note,by:(CURRENT_USER||{}).name||'',at:Date.now()};

    if(head)notifyM(head,'โครงการเลขที่ '+no+' คำขอ'+r.type+' — ไม่อนุมัติ',body,no);

  }

  r.decision={result:res,meetingNo:meet,date,note,by:(CURRENT_USER||{}).name||'',at:Date.now()};

}

function budCatSums(b){
  const out={rev:0,cats:{}};if(!b||typeof b!=='object')return out;
  (Array.isArray(b.rev)?b.rev:[]).forEach(r=>{out.rev+=bnum(r&&r.amount);});
  BUD_CATS.forEach(x=>{let t=0;((b.cats&&b.cats[x[0]])||[]).forEach(r=>{t+=bnum(r&&r.amount);});out.cats[x[0]]=t;});
  // หมวดอัตโนมัติ (สาธารณูปโภค 5% · อุดหนุน 10% · สำรอง 5%) คำนวณจากรายรับด้วยสูตรเดียวกับแบบเสนอ
  Object.keys(BUD_AUTO).forEach(k=>{if(k in out.cats)out.cats[k]=Math.round(out.rev*BUD_AUTO[k]);});
  return out;
}

    <tr><td>ประเภทธุรกิจ</td><td>${pr(p.businessType,p.businessName)}</td></tr>

function cuerpWorkHtml(p){
  const pc=p.pendingCuerp||{},d=pc.info||{};
  let rows='';
  if(d.meetingNo||d.memoNo)rows+=`<tr><td>อ้างอิงการอนุมัติ</td><td colspan="2">${d.meetingNo?'มติคณะกรรมการบริหาร ครั้งที่ '+esc(d.meetingNo):''}${d.memoNo?'หนังสือเลขที่ '+esc(d.memoNo):''}${d.date?' ลงวันที่ '+fmtDate(d.date):''}</td></tr>`;
  if(pc.period&&d.period)rows+=`<tr><td>ระยะเวลาโครงการ</td><td>${esc(d.period.old||'—')}</td><td><b>${esc(d.period.neu||'—')}</b></td></tr>`;
  if(pc.disburse&&d.disburse)rows+=`<tr><td>วันที่เบิกจ่ายได้ถึง</td><td>${d.disburse.old?fmtDate(d.disburse.old):'—'}</td><td><b>${d.disburse.neu?fmtDate(d.disburse.neu):'—'}</b></td></tr>`;
  if(pc.budget&&d.budget){
    (d.budget.rows||[]).forEach(r=>{rows+=`<tr><td>${esc(r.label)}</td><td class="r">${fmt2(r.old)}</td><td class="r"><b>${fmt2(r.neu)}</b></td></tr>`;});
    rows+=`<tr class="tot"><td>รวมรายรับ</td><td class="r">${fmt2(d.budget.revOld)}</td><td class="r"><b>${fmt2(d.budget.revNew)}</b></td></tr>`;
    rows+=`<tr class="tot"><td>รวมรายจ่าย</td><td class="r">${fmt2(d.budget.expOld)}</td><td class="r"><b>${fmt2(d.budget.expNew)}</b></td></tr>`;
  }
  return `${cuerpSetHtml(p)}
   <table class="cq-tbl" style="margin-top:8px"><tr><th>รายการที่อนุมัติ</th><th style="width:28%">เดิม</th><th style="width:28%">ที่อนุมัติใหม่</th></tr>${rows||'<tr><td colspan="3" style="color:#7f93a8">ไม่มีรายละเอียด</td></tr>'}</table>`;
}
function cuerpWorkText(p){
  const pc=p.pendingCuerp||{},d=pc.info||{},L=[];
  L.push('ชุดงบประมาณ CUERP: ประเภทธุรกิจ '+(p.businessType||'-')+' · ศูนย์ต้นทุน '+(p.costCenter||'-')+' · กองทุน '+(p.fund||'-')+' · เขตตามหน้าที่ '+(p.dutyZone||'-'));
  if(pc.period&&d.period)L.push('ระยะเวลาโครงการ: '+(d.period.old||'-')+' → '+(d.period.neu||'-'));
  if(pc.disburse&&d.disburse)L.push('เบิกจ่ายได้ถึง: '+(d.disburse.old?fmtDate(d.disburse.old):'-')+' → '+(d.disburse.neu?fmtDate(d.disburse.neu):'-'));
  if(pc.budget&&d.budget){(d.budget.rows||[]).forEach(r=>L.push(r.label+': '+fmt2(r.old)+' → '+fmt2(r.neu)));
    L.push('รวมรายจ่าย: '+fmt2(d.budget.expOld)+' → '+fmt2(d.budget.expNew));}
  return L.join('\n');
}

function saveRenew(no,ri){
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return false;
  if(ROLE!=='admin'){toast('เฉพาะหัวหน้างาน','bad');return false;}
  if(ri===undefined&&p.pendingCuerp){toast('ยังมีรายการรอแผนยืนยันใน CUERP — ให้ยืนยันก่อน','bad');return false;}
  const gv=id=>{const e=document.getElementById(id);return e?(e.value||''):'';};
  const ns=gv('rn_ns'), ne=gv('rn_ne');
  const _st0=p.approvedStart||p.startDate||'';
  if(ns&&ne&&ne<=ns){toast('วันสิ้นสุดใหม่ต้องอยู่หลังวันเริ่มใหม่','bad');return false;}
  if(ne&&p.endDate&&ne<=p.endDate&&ri!==undefined){toast('วันสิ้นสุดใหม่ต้องอยู่หลังวันสิ้นสุดเดิม ('+fmtDate(p.endDate)+')','bad');return false;}
  const newPeriod=(ns&&ne)?(fmtDate(_st0||ns)+' – '+fmtDate(ne)):'';
  const embedded=!!document.getElementById('rnBudBox');   // ตารางแยกหมวดฝังอยู่
  const prop=p.fromProposal?(DB.proposals||[]).find(x=>x.id===p.fromProposal):null;
  let newRev=null,newExp=null,newBudget=null;
  if(embedded&&REV){
    const t=revTotals();newRev=t.rn;newExp=t.en;
    newBudget={rev:REV.rev.map(r=>({label:r.label,amount:bnum(r.neu)})),cats:{}};
    BUD_CATS.forEach(x=>{newBudget.cats[x[0]]=REV.cats[x[0]].map(r=>({label:r.label,amount:bnum(r.neu)}));});
  } else {
    const revRaw=(document.getElementById('rn_rev')||{}).value||'', expRaw=(document.getElementById('rn_exp')||{}).value||'';
    newRev=revRaw.trim()?numv('rn_rev'):null;newExp=expRaw.trim()?numv('rn_exp'):null;
  }
  const newDisb=gv('rn_disb')||null;
  const budChanged=(newBudget?(newRev!==(+p.estRevenue||0)||newExp!==(+p.estExpense||0)||true):(newRev!==null||newExp!==null));
  if(ri!==undefined&&!newPeriod&&!(embedded||newRev!==null||newExp!==null)){toast(ns||ne?'กรอกวันเริ่มใหม่และวันสิ้นสุดใหม่ให้ครบ':'กรอกค่าที่อนุมัติให้ครบ','bad');return false;}
  if(!newPeriod && !budChanged && !newDisb){toast('กรอกระยะเวลา / งบ / วันเบิกจ่าย อย่างน้อย 1 อย่าง','bad');return false;}
  const oldPeriod=p.period||'', oldRev=+p.estRevenue||0, oldExp=+p.estExpense||0, oldDisb=p.disburseDate||'';
  // สแนปช็อตก่อนอัปเดต สำหรับตรวจว่าปรับงบจริงหรือไม่ (รวมการย้ายเงินระหว่างหมวด)
  const _oldSums=budCatSums(prop&&prop.budget), _budRows=[];
  let _budReal=false;
  if(newBudget){
    const ns2=budCatSums(newBudget);
    BUD_CATS.forEach(x=>{const o=_oldSums.cats[x[0]]||0,v=ns2.cats[x[0]]||0;if(Math.abs(o-v)>0.004){_budRows.push({label:x[1],old:o,neu:v});}});
    if(Math.abs(_oldSums.rev-ns2.rev)>0.004)_budRows.unshift({label:'รายรับ',old:_oldSums.rev,neu:ns2.rev});
    _budReal=_budRows.length>0;
  }else{
    _budReal=(newRev!==null&&newRev!==oldRev)||(newExp!==null&&newExp!==oldExp);
  }
  const rn={date:gv('rn_date').trim(),meetingNo:gv('rn_meet').trim(),note:gv('rn_note').trim(),reqIndex:(ri===undefined?null:ri),
    changePeriod:!!newPeriod, changeBudget:budChanged, changeDisburse:!!newDisb,
    oldPeriod, newPeriod:newPeriod||oldPeriod, oldRevenue:oldRev, newRevenue:newRev===null?oldRev:newRev,
    oldExpense:oldExp, newExpense:newExp===null?oldExp:newExp, oldDisburse:oldDisb, newDisburse:newDisb||oldDisb,
    disbApproveDate:gv('rn_disbDate').trim(),disbMemoNo:gv('rn_disbMemo').trim(),period:newPeriod||oldPeriod};
  p.renewals=p.renewals||[];p.renewals.push(rn);
  if(newPeriod){const _oe=p.endDate||'';p.period=newPeriod;p.endDate=ne;p.terms=p.terms||[];if(!p.approvedEnd&&_oe)p.approvedEnd=_oe;if(!p.approvedStart&&_st0)p.approvedStart=_st0;if(!p.approvedDisburse&&oldDisb)p.approvedDisburse=oldDisb;const _nd=newDisb||addMonths(ne,3);p.terms.push({start:ns,end:ne,disburse:_nd,approveDate:rn.date,meetingNo:rn.meetingNo,note:rn.note});if(!newDisb)p.disburseDate=_nd;}
  if(newBudget&&prop){                                   // อัปเดตงบแยกหมวดในแบบเสนอ + เก็บประวัติ
    const oldBudget=JSON.parse(JSON.stringify(prop.budget||{}));
    prop.budget=newBudget;prop.budgetRevenue=newRev;prop.budgetExpense=newExp;
    prop.budgetRevisions=prop.budgetRevisions||[];
    prop.budgetRevisions.push({date:rn.date,meetingNo:rn.meetingNo,note:rn.note,changeTime:!!newPeriod,changeBudget:true,status:'อนุมัติแล้ว',oldBudget,newBudget,oldRev,newRev,oldExp,newExp,oldStart:ns,oldEnd:ne,newStart:ns,newEnd:ne});
  }
  if(newRev!==null)p.estRevenue=newRev;
  if(newExp!==null)p.estExpense=newExp;
  if(newDisb)p.disburseDate=newDisb;
  if(!p.approveDate&&rn.date)p.approveDate=rn.date;if(!p.meetingNo&&rn.meetingNo)p.meetingNo=rn.meetingNo;   // v36: ไม่ทับมติอนุมัติครั้งแรก
  if(String(p.status||'').indexOf('รอปิด')!==0)p.status='ยังไม่ปิดโครงการ';
  if(ri!==undefined){const _r=(p.changeReqs||[])[ri];if(_r)_r.status='รอดำเนินการใน CUERP';}
  else (p.changeReqs||[]).forEach(function(r){if(r.status==='รออนุมัติ')r.status='รอดำเนินการใน CUERP';});
  // หลังอนุมัติ → รอเจ้าหน้าที่แผนไปยื่น/ขยายในระบบ CUERP แล้วกดยืนยัน
  p.pendingCuerp={period:!!newPeriod, budget:!!_budReal, disburse:(!!newDisb||!!newPeriod), at:Date.now(),
    info:{meetingNo:rn.meetingNo,date:rn.date,
      period:{old:oldPeriod,neu:newPeriod||oldPeriod},
      disburse:{old:oldDisb,neu:newDisb||p.disburseDate||oldDisb},
      budget:{rows:_budRows,revOld:oldRev,revNew:(newRev===null?oldRev:newRev),expOld:oldExp,expNew:(newExp===null?oldExp:newExp)}}};
  var _lbl=[newPeriod?'ขยายเวลาโครงการ':'', _budReal?'ปรับงบประมาณ':'', (newDisb||newPeriod)?'ขยายเวลาเบิกจ่าย':''].filter(Boolean).join(' + ');
  var _pm='โครงการเลขที่ '+no+' ('+_lbl+') ได้รับอนุมัติแล้ว ตามมติคณะกรรมการบริหาร ครั้งที่ '+(rn.meetingNo||'-')+'\n'+cuerpWorkText(p)+'\nกรุณาดำเนินการในระบบ CUERP แล้วกดยืนยัน "ทำใน CUERP แล้ว" ในระบบ';
  notify('policy','โครงการเลขที่ '+no+' อนุมัติแล้ว — ดำเนินการในระบบ CUERP',_pm,no,mkMail('','โครงการเลขที่ '+no+' อนุมัติแล้ว — ดำเนินการในระบบ CUERP',_pm,'policy'));
  logAct('อนุมัติการเปลี่ยนแปลง ('+_lbl+') โครงการ '+no+' — รอแผนทำใน CUERP');save();closeModal();render(no);updNotifBell();toast('บันทึกอนุมัติแล้ว · แจ้งแผนให้ดำเนินการในระบบ CUERP','ok');
  return true;
}

     <button class="btn primary" style="background:var(--red);border-color:var(--red)" onclick="doDelProject('${esc(no)}')">ยืนยันลบถาวร</button></div>`);

function doDelProject(no){
  if(ROLE!=='admin'){toast('ไม่มีสิทธิ์','bad');return;}
  const p=DB.projects.find(x=>x.projNo===no);if(!p)return;
  const typed=((document.getElementById('del_confirm')||{}).value||'').trim();
  if(typed!==no){toast('เลขที่โครงการไม่ตรง — พิมพ์ '+no+' เพื่อยืนยัน','bad');return;}
  const reason=((document.getElementById('del_reason')||{}).value||'').trim();
  if(!reason){toast('กรุณาระบุเหตุผลที่ลบ','bad');return;}
  const me=CURRENT_USER||{};
  const L=tx(no)||[];
  // เก็บสำเนาไว้ในถังขยะ (กู้โดยผู้พัฒนาได้จากไฟล์สำรอง)
  DB.meta=DB.meta||{};DB.meta.trash=DB.meta.trash||[];
  DB.meta.trash.push({at:Date.now(),by:me.name||me.email||'',reason:reason,project:JSON.parse(JSON.stringify(p)),ledger:JSON.parse(JSON.stringify(L))});
  if(DB.meta.trash.length>20)DB.meta.trash=DB.meta.trash.slice(-20);
  DB.projects=DB.projects.filter(x=>x.projNo!==no);
  DB.ledger=DB.ledger.filter(x=>x.projNo!==no);
  REGSEL=null;
  logAct('ลบโครงการ '+no+' ('+(p.fullName||'')+') · รายการรับ-จ่าย '+L.length+' รายการ · เหตุผล: '+reason);
  save();closeModal();go('reg');updNotifBell();toast('ลบโครงการ '+no+' แล้ว · บันทึกไว้ใน Activity Log','ok');
}

<td class="nowrap">${fmtDate(x.date)}</td><td style="min-width:120px">${esc(x.type)}</td><td>${esc(x.detail)}</td>
<td class="nowrap">${esc(x.docNo)}</td><td class="r in">${x.in?fmt(x.in):''}</td><td class="r out">${x.out?fmt(x.out):''}</td><td class="r tnum">${fmt(bal)}</td>

  const head=`<div class="head"><div><h1>สมุดรับ-จ่าย</h1><div class="desc">ค้นหาแล้วเลือกโครงการเพื่อแสดงรายการ</div></div>

<div style="min-width:260px;max-width:380px">${acBox('ledSel',LEDFILTER,'led','ค้นหา: เลขที่ · ชื่อ · หัวหน้าโครงการ')}</div>
<button class="btn ghost sm" onclick="printLedger()">พิมพ์</button>
<button class="btn primary sm canedit" onclick="go('fin')">+ เพิ่มรายการ</button>

  return head+`
<div class="panel">

function roleEmails(role){try{return (DB.meta.users||[]).filter(u=>u.role===role&&u.email).map(u=>u.email).join(',');}catch(e){return '';}}
/* v27: แจ้งกระดิ่ง + อีเมล ในคำสั่งเดียว (to เป็นบทบาท หรือ ชื่อ/อีเมลบุคคล) */
function notifyM(to,title,body,projNo){const isRole=['admin','finance','policy','exec','staff'].includes(to);notify(to,title,body,projNo,isRole?mkMail('',title,body,to):mkMail(userEmailByName(to),title,body));}
function mkMail(email,subj,body,role){var em=email||(role?roleEmails(role):'');return em?{email:em,cc:(DB.meta&&DB.meta.ccEmails)||'',subj:subj,body:body}:null;}
/* v39.5: แนบข้อมูลโครงการไปกับอีเมล — ระบบกลาง (Code v8) ตั้งหัวเรื่อง "เลขโครงการ ชื่อโครงการ — เรื่อง" + การ์ด HTML */
function mailMeta(title,projNo){
  let no=String(projNo||'').trim(),name='';
  const p=no&&(DB.projects||[]).find(x=>x.projNo===no);
  if(p)name=p.fullName||p.shortName||'';
  if(!name&&no){const pr=(DB.proposals||[]).find(x=>x.projNo===no||x.id===no);if(pr){name=pr.projName||'';if(pr.id===no)no=pr.projNo||'';}}
  const mt=/"([^"]+)"/.exec(String(title||''));if(!name&&mt)name=mt[1];
  if(!no){const mn=/โครงการเลขที่\s+(\S+)/.exec(String(title||''));if(mn)no=mn[1];}
  if(!name&&no){const p2=(DB.projects||[]).find(x=>x.projNo===no);if(p2)name=p2.fullName||p2.shortName||'';}
  let topic=String(title||'').replace(/โครงการเลขที่\s+\S+/,'').replace(/(ข้อเสนอโครงการ|โครงการ)?\s*"[^"]*"/,'').replace(/^[\s\-–—:·]+|[\s\-–—:·]+$/g,'').trim();
  let link='';try{if(/^https:/.test(location.protocol))link=location.origin+location.pathname;}catch(e){}
  return {projNo:no,projName:name,topic:topic,link:link};}
function notify(to,title,body,projNo,mail){if(mail){try{Object.assign(mail,mailMeta(title,projNo));}catch(e){}}DB.meta.notifs=DB.meta.notifs||[];DB.meta.notifs.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),to:(to||''),title:title,body:body||'',projNo:projNo||'',ts:Date.now(),read:false,mail:mail||null});if((DB.meta.notifs.length)>300)DB.meta.notifs=DB.meta.notifs.slice(0,300);}
function myKeys(){const u=CURRENT_USER||{};return [u.email,ROLE,u.coordName,u.vetName,u.headName,u.name].filter(Boolean).map(x=>(''+x).toLowerCase());}
function myNotifs(){const k=myKeys();return (DB.meta.notifs||[]).filter(n=>{const to=(''+n.to).toLowerCase();if(to==='all'||to==='*')return true;if(k.includes(to))return true;const pp=splitPerson(n.to);return (pp.name&&k.includes(pp.name.toLowerCase()))||(pp.email&&k.includes(pp.email.toLowerCase()));});}
function unreadN(){return myNotifs().filter(n=>!n.read).length;}
let LAST_UNREAD=null;
function updNotifBell(){const b=document.getElementById('notifDot');if(!b)return;const c=unreadN();
  // v22: ไม่มีเสียงแจ้งเตือน — แจ้งเตือนอยู่ที่กระดิ่งเท่านั้น
  LAST_UNREAD=c;b.textContent=c||'';b.style.display=c?'inline-flex':'none';}
function userEmailByName(name){if(!name)return '';const pp=splitPerson(name);if(pp.email)return pp.email;const u=(DB.meta.users||[]).find(x=>[x.coordName,x.vetName,x.name,x.headName,x.email].filter(Boolean).map(v=>''+v).includes(pp.name||(''+name)));return u?u.email:'';}
function mailLink(email,subj,body,cc){return 'mailto:'+encodeURIComponent(email||'')+'?subject='+encodeURIComponent(subj||'')+(cc?'&cc='+encodeURIComponent(cc):'')+'&body='+encodeURIComponent(body||'');}

function helpSection(v){const h=HELP[v]||HELP.dash;

  <p style="margin-top:4px"><b>เมนูที่คุณใช้:</b> ${allow.map(v=>'<span class="who">'+esc(HELP[v].t.split(' — ')[0].split(' (')[0])+'</span>').join(' ')}</p></div>
  <div class="mf" style="align-items:center;flex-wrap:wrap">${manual?'':'<label style="font-size:13px;margin-right:auto;display:flex;gap:6px;align-items:center;white-space:nowrap;flex:1 1 100%"><input type="checkbox" id="gd_hide" checked> ไม่ต้องแสดงอีกในเครื่องนี้</label>'}<button class="btn ghost" onclick="closeModal();openHelp()">ดูวิธีใช้หน้านี้</button><button class="btn primary" onclick="closeGuide()">เริ่มใช้งาน</button></div>`);}

    [/ออกใบแจ้งหนี้แล้ว/, 'หัวหน้างานออกใบแจ้งหนี้ของ'+no+' แล้ว'],
    [/ได้รับมอบหมายเป็นผู้ประสานงาน/, 'คุณได้รับเลือกให้เป็นเจ้าหน้าที่ประสานงาน'+no],

    [/คำขอขยายเวลาโครงการ/, 'หัวหน้าโครงการขอขยายเวลา'+no],
    [/อนุมัติขยายเวลาเบิกจ่าย|ขยายเวลาเบิกจ่าย/, no+' ได้รับอนุมัติให้ขยายเวลาเบิกจ่ายแล้ว'],
    [/ดำเนินการในระบบ CUERP/, no+' ได้รับอนุมัติแล้ว รอแผนดำเนินการในระบบ CUERP'],
    [/ทำใน CUERP แล้ว|ยืนยันทำใน CUERP/, 'แผนดำเนินการใน CUERP ของ'+no+' เรียบร้อยแล้ว'],
    [/มีคำขอปิดโครงการ/, 'หัวหน้าโครงการขอปิด'+no],
    [/ปิดโครงการแล้ว/, no+' ปิดเรียบร้อยแล้ว'],
    [/ใกล้สิ้นสุด/, no+' ใกล้สิ้นสุดระยะเวลาดำเนินการ'],
    [/ยื่นขออนุมัติ/, 'มี'+no+' ยื่นขออนุมัติเข้ามาใหม่'],
    [/สำรองข้อมูล/, 'ถึงเวลาสำรองข้อมูลระบบแล้ว'],

function briefTodo(nf){

function chime(){                                   // เสียงแจ้งเตือนสั้น "ติ้ง-ต็อง"
  if(DB.meta&&DB.meta.soundOn===false)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    CHIME_CTX=CHIME_CTX||new AC();
    if(CHIME_CTX.state==='suspended'){try{CHIME_CTX.resume();}catch(e){}}
    const t0=CHIME_CTX.currentTime;
    [[988,0,0.18],[659,0.18,0.42]].forEach(([f,at,dur])=>{        // ติ้ง (B5) → ต็อง (E5)
      const o=CHIME_CTX.createOscillator(),g=CHIME_CTX.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+at);
      g.gain.exponentialRampToValueAtTime(0.22,t0+at+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
      o.connect(g);g.connect(CHIME_CTX.destination);
      o.start(t0+at);o.stop(t0+at+dur+0.02);
    });
  }catch(e){}
}
let CHIME_CTX=null;

const WHO_ROLE={'นโยบายและแผน':'policy','หัวหน้างาน':'admin','การเงิน':'finance','หัวหน้าโครงการ':'head','ผู้ประสานงาน':'coord'};
function lastActivityAt(p){try{const E=projTimeline(p);let t=E.length?E[E.length-1].at:null;t=(t instanceof Date)?t.getTime():+t;const L=tx(p.projNo)||[];L.forEach(x=>{const d=tlDate(x.date);if(d&&(!t||d>t))t=d;});return (isFinite(t)&&t>946684800000)?t:null;}catch(e){return null;}}
function daysSince(t){return t?Math.floor((Date.now()-t)/86400000):null;}
function myTasks(){
  const out=[];if(!ROLE)return out;const me=(CURRENT_USER&&CURRENT_USER.email)||'';
  const todayISO=new Date().toISOString().slice(0,10);
  // (1) ข้อเสนอโครงการ
  (DB.proposals||[]).forEach(pr=>{
    if(ROLE==='admin'&&pr.status==='ยื่นขออนุมัติ')out.push({no:pr.projNo||'ข้อเสนอ',name:pr.projName||'',what:'บันทึกมติคณะกรรมการ เพื่ออนุมัติข้อเสนอโครงการ',sub:'ยื่นโดย '+(pr.headName||pr.headUser||''),age:daysSince(tlDate(pr.submitDate)),view:'proposal',arg:pr.id});
    if(pr.headUser===me&&pr.status==='ร่าง')out.push({no:pr.projNo||'ร่าง',name:pr.projName||'(ยังไม่ตั้งชื่อ)',what:'ร่างข้อเสนอที่ยังไม่ได้ยื่นขออนุมัติ',sub:'กรอกให้ครบแล้วกด "ยื่นขออนุมัติ"',age:daysSince(tlDate(pr.createdAt)),view:'proposal',arg:pr.id});
  });
  // (2) โครงการในทะเบียน
  scopeProjects(DB.projects||[]).forEach(p=>{
    if(String(p.status||'').indexOf('ปิดแล้ว')===0)return;
    const ns=nextStepHint(p);const age=daysSince(lastActivityAt(p));
    const legacy=(age==null&&!p.fromProposal&&!(p.steps&&Object.values(p.steps).some(x=>x&&x.done)));   // โครงการเดิมก่อนใช้ระบบ: ไม่ไล่ขั้นตอนย้อนหลัง
    const wr=ns?WHO_ROLE[ns.who]:'';
    const mine=!legacy&&ns&&(wr===ROLE||(wr==='head'&&isHeadOf(p))||(wr==='coord'&&(isCoordOf(p)||(isHeadOf(p)&&!p.coordinator))));
    if(mine)out.push({no:p.projNo,name:p.shortName||p.fullName||'',what:ns.what,sub:'ขั้นถัดไปของโครงการ',age:age,view:'reg',arg:p.projNo});
    if(!legacy&&isHeadOf(p)&&!p.coordinator&&String(p.status||'').indexOf('รอปิด')!==0)out.push({no:p.projNo,name:p.shortName||p.fullName||'',what:'แต่งตั้งผู้ประสานงานและสัตวแพทย์',sub:'ทำได้ทันทีหลังได้รับอนุมัติ',age:age,view:'reg',arg:p.projNo});   // v38
    const end=p.endDate||'';
    if(end&&end<todayISO&&(isHeadOf(p)||ROLE==='admin')&&String(p.status||'').indexOf('รอปิด')!==0&&!(ns&&WHO_ROLE[ns.who]===ROLE&&/ปิด/.test(ns.what)))
      out.push({no:p.projNo,name:p.shortName||p.fullName||'',what:isHeadOf(p)?'โครงการเกินกำหนดสิ้นสุด — ขอปิดโครงการ หรือยื่นขอขยายเวลา':'โครงการเกินกำหนดสิ้นสุดและยังไม่ปิด — ติดตามหัวหน้าโครงการ',sub:'สิ้นสุด '+fmtDate(end),age:daysSince(tlDate(end)),view:'reg',arg:p.projNo,bad:true});
  });
  // ตัดซ้ำ (โครงการเดียวกัน งานเดียวกัน)
  const seen=new Set();return out.filter(t=>{const k=t.no+'|'+t.what;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>(b.bad?1:0)-(a.bad?1:0)||(b.age||0)-(a.age||0));
}

/* ---- structured budget (ประมาณการรับ-จ่าย ตามต้นฉบับ) ---- */
const BUD_CATS=[['comp','1. หมวดค่าตอบแทนคณะกรรมการดำเนินโครงการ'],['oper','2. หมวดค่าใช้สอย'],['mat','3. หมวดค่าวัสดุ'],['util','4. หมวดสาธารณูปโภค'],['sub10','5. หมวดเงินอุดหนุน'],['res5','6. เงินสำรองทั่วไป'],['cap','7. หมวดงบลงทุน (ถ้ามี)']];
const BUD_NOTE_DEFAULT='1. ขออนุมัติถัวจ่ายภายในหมวดค่าตอบแทน, ค่าวัสดุ, ค่าใช้สอย และเงินสำรองทั่วไป\n2. หากเสร็จสิ้นโครงการแล้ว มีรายรับเหนือรายจ่าย จะนำส่งเป็นเงินรายได้ของส่วนงานภายใน 30 วัน หลังจากสิ้นสุดโครงการ';
let BUD=null, BUD_EDIT=false;
function budDefault(){return {rev:[{label:'เงินสนับสนุนจากคณะ',amount:0}],cats:{
  comp:[{label:'',amount:0}], oper:[{label:'ค่าจ้างเหมาบริการ',amount:0}], mat:[{label:'วัสดุวิทยาศาสตร์',amount:0}],
  util:[{label:'ค่าสาธารณูปโภค 5%',amount:0}], sub10:[{label:'เงินอุดหนุนพัฒนาวิชาการศูนย์ 10%',amount:0}],
  res5:[{label:'เงินสำรองทั่วไป 5%',amount:0}], cap:[{label:'',amount:0}]}};}
function budInit(pr){BUD=pr.budget?JSON.parse(JSON.stringify(pr.budget)):budDefault();BUD.rev=BUD.rev&&BUD.rev.length?BUD.rev:[{label:'',amount:0}];BUD.cats=BUD.cats||{};BUD_CATS.forEach(x=>{if(!BUD.cats[x[0]]||!BUD.cats[x[0]].length)BUD.cats[x[0]]=[{label:'',amount:0}];});}
function bnum(v){return parseFloat((''+(v==null?'':v)).replace(/[^0-9.\-]/g,''))||0;}
const BUD_AUTO={util:0.05,sub10:0.10,res5:0.05};
function budApplyAuto(){const rev=BUD.rev.reduce((s,r)=>s+bnum(r.amount),0);Object.keys(BUD_AUTO).forEach(k=>{if(BUD.cats[k]&&BUD.cats[k][0])BUD.cats[k][0].amount=Math.round(rev*BUD_AUTO[k]);});return rev;}
function budTotals(){const rev=budApplyAuto();let exp=0;const subs={};BUD_CATS.forEach(x=>{const st=BUD.cats[x[0]].reduce((s,r)=>s+bnum(r.amount),0);subs[x[0]]=st;exp+=st;});return {rev,exp,subs};}
function budRowHtml(section,cat,idx,r,pfx,auto){const dis=(BUD_EDIT&&!auto)?'':'disabled';const amtId=auto?` id="budAuto_${cat}"`:'';return `<tr><td>${pfx?`<span class="bud-no">${pfx}</span>`:''}<input value="${esc(r.label)}" ${BUD_EDIT?'':'disabled'} oninput="budSet('${section}','${cat}',${idx},'label',this.value)" placeholder="รายการ..." style="display:inline-block;width:${pfx?'calc(100% - 42px)':'100%'}"></td><td class="r"><input${amtId} value="${r.amount?fmt2(r.amount):''}" ${dis} inputmode="numeric" oninput="budSet('${section}','${cat}',${idx},'amount',this.value);budUpd()" onblur="moneyFmtInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" style="text-align:right${auto?';background:#eef6f0;color:#1f7a4d;font-weight:600':''}" ${auto?'title="คำนวณอัตโนมัติจากยอดรายรับ"':''}></td><td class="c no-print">${(BUD_EDIT&&!auto)?`<button type="button" class="btn ghost sm" onclick="budDel('${section}','${cat}',${idx})">✕</button>`:''}</td></tr>`;}
function budTable(){const t=budTotals();let h=`<table class="bud-tbl"><thead><tr><th>รายละเอียด</th><th class="r">งบประมาณที่ตั้งไว้ (บาท)</th><th class="no-print"></th></tr></thead><tbody>`;
  h+=`<tr class="bud-head"><td colspan="3">ประมาณการรายรับ (ทุกแหล่งงบประมาณรายได้)</td></tr>`;
  BUD.rev.forEach((r,i)=>h+=budRowHtml('rev','rev',i,r));
  if(BUD_EDIT)h+=`<tr class="no-print bud-add"><td colspan="3"><button type="button" class="btn ghost sm" onclick="budAdd('rev','rev')">+ เพิ่มรายรับ</button></td></tr>`;
  h+=`<tr class="bud-total"><td>รวมประมาณการรายรับ</td><td class="r" id="budRevTotal">${fmt2(t.rev)}</td><td class="no-print"></td></tr>`;
  h+=`<tr class="bud-head"><td colspan="3">ประมาณการรายจ่าย</td></tr>`;
  BUD_CATS.forEach((x,ci)=>{h+=`<tr class="bud-cat"><td>${x[1]}</td><td class="r" id="budSub_${x[0]}">${fmt2(t.subs[x[0]])}</td><td class="no-print"></td></tr>`;
    BUD.cats[x[0]].forEach((r,i)=>h+=budRowHtml('exp',x[0],i,r,(ci+1)+'.'+(i+1),(BUD_AUTO[x[0]]&&i===0)));
    if(BUD_EDIT)h+=`<tr class="no-print bud-add"><td colspan="3" style="padding-left:24px"><button type="button" class="btn ghost sm" onclick="budAdd('exp','${x[0]}')">+ เพิ่มรายการ</button></td></tr>`;});
  h+=`<tr class="bud-total"><td>รวมประมาณการรายจ่าย</td><td class="r" id="budExpTotal">${fmt2(t.exp)}</td><td class="no-print"></td></tr>`;
  h+=`<tr class="bud-net"><td>ประมาณการรายรับเหนือรายจ่าย</td><td class="r" id="budNet">${fmt2(t.rev-t.exp)}</td><td class="no-print"></td></tr>`;
  return h+`</tbody></table>`;}
function moneyFmtInput(el){try{const v=bnum(el.value);el.value=(String(el.value).trim()&&v)?fmt2(v):'';}catch(e){}}
function budSet(section,cat,idx,field,val){const arr=section==='rev'?BUD.rev:BUD.cats[cat];if(arr&&arr[idx])arr[idx][field]=field==='amount'?bnum(val):val;}
function budAdd(section,cat){const arr=section==='rev'?BUD.rev:BUD.cats[cat];arr.push({label:'',amount:0});renderBud();}
function budDel(section,cat,idx){const arr=section==='rev'?BUD.rev:BUD.cats[cat];arr.splice(idx,1);if(!arr.length)arr.push({label:'',amount:0});renderBud();}
function renderBud(){const b=document.getElementById('budBox');if(b)b.innerHTML=budTable();}
function budUpd(){const t=budTotals(),set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=fmt2(v);};set('budRevTotal',t.rev);set('budExpTotal',t.exp);set('budNet',t.rev-t.exp);BUD_CATS.forEach(x=>set('budSub_'+x[0],t.subs[x[0]]));Object.keys(BUD_AUTO).forEach(k=>{const e=document.getElementById('budAuto_'+k);if(e)e.value=fmt2(BUD.cats[k][0].amount);});}
/* ---- Gantt ข้อ 10 (กิจกรรม × เดือน) ---- */
let GANTT=null, GANTT_EDIT=false;
/* v39.3: ตั้งช่วงเวลา Gantt ได้ (เดือนเริ่ม + ปี พ.ศ. + จำนวนเดือน) ตารางออกตามที่ตั้ง */
const GMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function ganttN(){return (GANTT&&Array.isArray(GANTT.months))?GANTT.months.length:12;}
function ganttFit(){const N=ganttN();GANTT.rows.forEach(r=>{if(!Array.isArray(r.m))r.m=[];r.m=r.m.slice(0,N);while(r.m.length<N)r.m.push(false);});}
function ganttInit(pr){GANTT=(pr.gantt&&pr.gantt.rows)?JSON.parse(JSON.stringify(pr.gantt)):{rows:[{act:'',m:[]}]};
  if(!Array.isArray(GANTT.months)||!GANTT.months.length){
    const sd=pr.startDate?new Date(pr.startDate):null;   // ค่าเริ่มต้น: ตามวันเริ่มโครงการ ถ้ายังไม่มี ใช้ ต.ค. ปีงบประมาณปัจจุบัน
    const now=new Date();const by=now.getMonth()>=9?now.getFullYear():now.getFullYear()-1;
    const sm=sd&&!isNaN(sd)?sd.getMonth():9, sy=(sd&&!isNaN(sd)?sd.getFullYear():by)+543;
    GANTT.period={m:sm,y:sy,n:12};GANTT.months=ganttLabels(sm,sy,12);}
  if(!GANTT.period){GANTT.period=ganttGuess(GANTT.months);}
  ganttFit();}
function ganttLabels(m,y,n){const out=[];for(let j=0;j<n;j++){const mm=(m+j)%12,yy=y+Math.floor((m+j)/12);out.push(GMON[mm]+' '+String(yy).slice(-2));}return out;}
function ganttGuess(mo){const t=String((mo||[])[0]||'');const i=GMON.findIndex(x=>t.startsWith(x));const yy=/(\d{2,4})\s*$/.exec(t);
  return {m:i>=0?i:9,y:yy?(yy[1].length===2?2500+ +yy[1]:+yy[1]):(new Date().getFullYear()+543),n:(mo||[]).length||12};}
function ganttPeriodApply(){if(!GANTT_EDIT)return;const g=id=>document.getElementById(id);
  const m=+g('gp_m').value,y=parseInt(g('gp_y').value,10),n=Math.min(36,Math.max(1,parseInt(g('gp_n').value,10)||1));
  if(!(y>2400&&y<2700)){toast('ปี พ.ศ. ไม่ถูกต้อง เช่น 2569','bad');return;}

function budReportTable(pr){

  h+=`<tr><td colspan="3" style="background:#faedf3;font-weight:600">ประมาณการรายรับ (ทุกแหล่งงบประมาณรายได้)</td></tr>`;

  h+=`<tr><td style="font-weight:700">รวมประมาณการรายรับ</td><td class="r" style="font-weight:700">${money(rev)}</td><td></td></tr>`;
  h+=`<tr><td colspan="3" style="background:#faedf3;font-weight:600">ประมาณการรายจ่าย</td></tr>`;
  BUD_CATS.forEach((x,ci)=>{const items=(b.cats&&b.cats[x[0]])||[];const st=items.reduce((s,r)=>s+bnum(r.amount),0);exp+=st;
    h+=`<tr><td style="font-weight:600">${x[1]}</td><td class="r" style="font-weight:600">${st?money(st):''}</td><td></td></tr>`;
    items.forEach((r,i)=>{if(r.label||r.amount)h+=`<tr><td style="padding-left:26px">${(ci+1)}.${(i+1)} ${esc(r.label)||'-'}</td><td></td><td class="r">${r.amount?money(r.amount):''}</td></tr>`;});});
  h+=`<tr><td style="font-weight:700">รวมประมาณการรายจ่าย</td><td class="r" style="font-weight:700">${money(exp)}</td><td></td></tr>`;
  h+=`<tr><td style="font-weight:700;background:#eef6f0">ประมาณการรายรับเหนือรายจ่าย</td><td class="r" style="font-weight:700;background:#eef6f0">${money(rev-exp)}</td><td></td></tr>`;
  return h+`</table>`;
}

function propParas(v,indentFirst){
  const raw=String(v==null?'':v).replace(/\r/g,'').replace(/ |　/g,' ');
  if(!raw.trim())return '';
  const LIST=/^(\d+(?:\.\d+)+[.)]?|\d+[.)]|[ก-ฮ][.)]|\(\d+\)|[-–•●▪])\s+/;
  const lines=raw.split('\n');
  const levelOf=l=>((l.match(/^[ \t]*/)||[''])[0]).replace(/\t/g,'    ').length;
  // ย่อหน้าธรรมดาทุกย่อหน้าในหัวข้อเดียวกันต้องย่อเท่ากัน:
  // ติ๊กย่อหน้าอัตโนมัติ หรือผู้ใช้เคาะวรรค/Tab หน้าย่อหน้าใดย่อหน้าหนึ่ง → ย่อ 2.5em ทุกย่อหน้า
  const anyManual=lines.some(l=>l.trim()&&!LIST.test(l.trim())&&levelOf(l)>0);
  const IND=(indentFirst||anyManual)?'text-indent:2.5em;':'';
  const base=indentFirst?2.5:0;
  const out=[];let blank=false,lastItem=null;
  lines.forEach(line=>{
    if(!line.trim()){blank=true;return;}
    const lvl=levelOf(line),txt=line.trim(),m=txt.match(LIST);
    const gap=blank?'margin-top:.5em;':'';
    if(m){                                                   // ข้อ: เลข + เนื้อหา บรรทัดที่ตัดขึ้นใหม่ตรงกับเนื้อหา
      const sub=/^\d/.test(m[1])?m[1].replace(/[.)]$/,'').split('.').length-1:0;   // v38.9: 1.1 / 1.1.1 ย่อเข้าตามชั้นอัตโนมัติ
      const pl=base+lvl*0.55+sub*2.35,pad=pl?`padding-left:${pl.toFixed(2)}em;`:'';
      lastItem={pad,mk:m[1],lvl};
      out.push(`<div class="pp-li" style="${pad}${gap}"><span class="pp-mk">${esc(m[1])}</span><span class="pp-tx">${esc(txt.slice(m[0].length))}</span></div>`);
    }else if(lastItem&&lvl>0){                               // บรรทัดเคาะวรรคต่อจากข้อ = ย่อหน้าต่อของข้อนั้น ตรงแนวเนื้อหาข้อ
      out.push(`<div class="pp-li" style="${lastItem.pad}${gap}"><span class="pp-mk" style="visibility:hidden">${esc(lastItem.mk)}</span><span class="pp-tx">${esc(txt)}</span></div>`);
    }else{                                                   // ย่อหน้าธรรมดา: ย่อบรรทัดแรก บรรทัดถัดไปชิดซ้าย
      lastItem=null;
      out.push(`<div class="pp-p" style="${IND}${gap}">${esc(txt)}</div>`);
    }
    blank=false;
  });
  return out.join('');
}

let REV=null;
function revInit(pr){const b=pr.budget||budDefault();
  REV={rev:(b.rev||[]).map(r=>({label:r.label,old:bnum(r.amount),neu:bnum(r.amount)})),cats:{}};
  BUD_CATS.forEach(x=>{REV.cats[x[0]]=((b.cats&&b.cats[x[0]])||[]).map(r=>({label:r.label,old:bnum(r.amount),neu:bnum(r.amount)}));});}
function revApplyAuto(){const rn=REV.rev.reduce((s,r)=>s+bnum(r.neu),0);Object.keys(BUD_AUTO).forEach(k=>{if(REV.cats[k]&&REV.cats[k][0])REV.cats[k][0].neu=Math.round(rn*BUD_AUTO[k]);});}
function revTotals(){revApplyAuto();let ro=0,rn=0,eo=0,en=0;const so={},sn={};
  REV.rev.forEach(r=>{ro+=r.old;rn+=bnum(r.neu);});
  BUD_CATS.forEach(x=>{let a=0,c=0;REV.cats[x[0]].forEach(r=>{a+=r.old;c+=bnum(r.neu);});so[x[0]]=a;sn[x[0]]=c;eo+=a;en+=c;});
  return {ro,rn,eo,en,so,sn};}
function revSet(sec,cat,idx,val){const arr=sec==='rev'?REV.rev:REV.cats[cat];if(arr&&arr[idx])arr[idx].neu=bnum(val);}
function revRow(sec,cat,idx,r,pfx,auto){const amtId=auto?` id="rvAuto_${cat}"`:'';const d=bnum(r.neu)-bnum(r.old);
  return `<tr><td>${pfx?`<span class="bud-no">${pfx}</span>`:''}${esc(r.label)||'-'}${auto?'<div style="font-size:12px;color:var(--muted)">คำนวณอัตโนมัติจากรายรับ</div>':''}</td><td class="r">${r.old?fmt2(r.old):'-'}</td><td class="r"><input${amtId} value="${r.neu?fmt2(r.neu):''}" ${auto?'disabled':''} inputmode="numeric" aria-label="ขอปรับใหม่ ${esc(r.label)||''}" oninput="revSet('${sec}','${cat}',${idx},this.value);revUpd()" onblur="moneyFmtInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" style="text-align:right"></td><td class="r diff ${d>0?'up':d<0?'dn':''}" id="rvD_${sec}_${cat}_${idx}">${d?((d>0?'+':'−')+fmt2(Math.abs(d))):'—'}</td></tr>`;}
function revTable(){const t=revTotals();
  let h=`<table class="bud-tbl"><thead><tr><th>รายละเอียด</th><th class="r" style="width:19%">เดิม</th><th class="r" style="width:24%">ขอปรับใหม่ ✎</th><th class="r" style="width:17%">ผลต่าง</th></tr></thead><tbody>`;
  h+=`<tr class="bud-head"><td colspan="4">ประมาณการรายรับ</td></tr>`;
  REV.rev.forEach((r,i)=>h+=revRow('rev','rev',i,r));
  h+=`<tr class="bud-total"><td>รวมประมาณการรายรับ</td><td class="r" id="rvRo">${fmt2(t.ro)}</td><td class="r" id="rvRn">${fmt2(t.rn)}</td><td class="r diff" id="rvDR">${revDiff(t.rn-t.ro)}</td></tr>`;
  h+=`<tr class="bud-head"><td colspan="4">ประมาณการรายจ่าย</td></tr>`;
  BUD_CATS.forEach((x,ci)=>{h+=`<tr class="bud-cat"><td>${x[1]}</td><td class="r" id="rvSo_${x[0]}">${fmt2(t.so[x[0]])}</td><td class="r" id="rvSn_${x[0]}">${fmt2(t.sn[x[0]])}</td><td class="r diff" id="rvDS_${x[0]}">${revDiff(t.sn[x[0]]-t.so[x[0]])}</td></tr>`;
    REV.cats[x[0]].forEach((r,i)=>h+=revRow('exp',x[0],i,r,(ci+1)+'.'+(i+1),(BUD_AUTO[x[0]]&&i===0)));});
  h+=`<tr class="bud-total"><td>รวมประมาณการรายจ่าย</td><td class="r" id="rvEo">${fmt2(t.eo)}</td><td class="r" id="rvEn">${fmt2(t.en)}</td><td class="r diff" id="rvDE">${revDiff(t.en-t.eo)}</td></tr>`;
  h+=`<tr class="bud-net"><td>ประมาณการรายรับเหนือรายจ่าย</td><td class="r" id="rvNo">${fmt2(t.ro-t.eo)}</td><td class="r" id="rvNn">${fmt2(t.rn-t.en)}</td><td class="r diff" id="rvDN">${revDiff((t.rn-t.en)-(t.ro-t.eo))}</td></tr>`;
  return h+`</tbody></table>`;}
function revDiff(d){d=Math.round(d*100)/100;if(!d)return '—';return (d>0?'+':'−')+fmt2(Math.abs(d));}
function revSummary(){const t=revTotals();const n=t.rn-t.en;
  return `<div class="rev-sum" id="revSum"><div><div class="k">รายรับใหม่</div><div class="v">${fmt2(t.rn)}<small>${revDiff(t.rn-t.ro)}</small></div></div><div><div class="k">รายจ่ายใหม่</div><div class="v">${fmt2(t.en)}<small>${revDiff(t.en-t.eo)}</small></div></div><div><div class="k">รายรับเหนือรายจ่าย</div><div class="v ${n<0?'neg':''}">${fmt2(n)}</div></div></div>`;}
function revUpd(){const t=revTotals(),set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=fmt2(v);};
  set('rvRo',t.ro);set('rvRn',t.rn);set('rvEo',t.eo);set('rvEn',t.en);set('rvNo',t.ro-t.eo);set('rvNn',t.rn-t.en);
  BUD_CATS.forEach(x=>{set('rvSo_'+x[0],t.so[x[0]]);set('rvSn_'+x[0],t.sn[x[0]]);});
  Object.keys(BUD_AUTO).forEach(k=>{const e=document.getElementById('rvAuto_'+k);if(e)e.value=fmt2(REV.cats[k][0].neu);});
  const sd=(id,d)=>{const e=document.getElementById(id);if(!e)return;d=Math.round(d*100)/100;e.textContent=revDiff(d);e.classList.toggle('up',d>0);e.classList.toggle('dn',d<0);};
  REV.rev.forEach((r,i)=>sd('rvD_rev_rev_'+i,bnum(r.neu)-bnum(r.old)));
  BUD_CATS.forEach(x=>{(REV.cats[x[0]]||[]).forEach((r,i)=>sd('rvD_exp_'+x[0]+'_'+i,bnum(r.neu)-bnum(r.old)));sd('rvDS_'+x[0],t.sn[x[0]]-t.so[x[0]]);});
  sd('rvDR',t.rn-t.ro);sd('rvDE',t.en-t.eo);sd('rvDN',(t.rn-t.en)-(t.ro-t.eo));
  const s=document.getElementById('revSum');if(s)s.outerHTML=revSummary();}

function revReportTable(oldB,newB){const money=v=>fmt2(v||0);const sumRev=b=>(b.rev||[]).reduce((s,r)=>s+bnum(r.amount),0);let eo=0,en=0;

function revisionReport(id,idx){

function saveUser(i){
  const email=(document.getElementById('u_email').value||'').trim().toLowerCase();
  const pass=(document.getElementById('u_pass').value||'').trim();
  const _prevPass=(i>=0&&DB.meta.users[i])?String(DB.meta.users[i].pass):null;
  const role=document.getElementById('u_role').value;
  if(!email||(i<0&&!pass&&!SESS)){toast('กรอกอีเมลและรหัสผ่าน','bad');return;}
  if(!/^[^\s@]+@[^\s@]+$/.test(email)){toast('รูปแบบอีเมลไม่ถูกต้อง','bad');return;}
  const dup=DB.meta.users.findIndex(x=>(x.email||'').toLowerCase()===email);
  if(dup>=0&&dup!==i){toast('อีเมลนี้มีอยู่แล้ว','bad');return;}
  if(i>=0&&CURRENT_USER&&(DB.meta.users[i].email||'').toLowerCase()===(CURRENT_USER.email||'').toLowerCase()&&email!==(CURRENT_USER.email||'').toLowerCase()){toast('เปลี่ยนอีเมลของบัญชีที่กำลังใช้งานอยู่ไม่ได้ — ให้หัวหน้างานอีกคนแก้ให้','bad');return;}
  const _old=(i>=0&&DB.meta.users[i])||{};
  const _selfX=CURRENT_USER&&(CURRENT_USER.email||'').toLowerCase()===email;
  if(SESS&&_selfX&&pass){toast('เปลี่ยนรหัสของตัวเองที่ปุ่ม "เปลี่ยนรหัสผ่าน" มุมซ้ายล่าง','bad');return;}
  const u={email,name:(document.getElementById('u_name').value||'').trim(),role,pass:(SESS?(i<0?(pass||'1234'):undefined):(pass?pwHash(pass):(_prevPass==null?'':_prevPass))),headName:_old.headName||'',coordName:_old.coordName||'',vetName:_old.vetName||'',aliases:((document.getElementById('u_alias')||{}).value||'').trim()};
  if(_old.legacyRole)u.legacyRole=_old.legacyRole;
  if(i>=0&&_old.role==='admin'&&role!=='admin'&&DB.meta.users.filter(x=>x.role==='admin').length<=1){toast('ต้องมีหัวหน้างาน (ผู้ดูแลระบบ) อย่างน้อย 1 คน','bad');return;}   // ชื่อที่เคยผูกไว้ (ระบบเดิม) เก็บเป็นชื่อสำรองสำหรับจับคู่โครงการเก่า
  const _self=CURRENT_USER&&(CURRENT_USER.email||'').toLowerCase()===email;
  const _passChanged=!!pass;
  if(_self){ if(_passChanged&&cloudCfg()&&AUTH_OLD==null)AUTH_OLD=_prevPass; }

  else if(_passChanged){ u.mustChange=true; }          // ผู้ดูแลตั้ง/รีเซ็ตรหัสให้ -> เจ้าของบัญชีต้องเปลี่ยนเองเมื่อเข้าใช้
  else if(i>=0&&DB.meta.users[i]&&DB.meta.users[i].mustChange){ u.mustChange=true; }
  if(u.pass===undefined)delete u.pass;
  if(SESS&&i<0)u.mustChange=true;
  if(i>=0)DB.meta.users[i]=u;else DB.meta.users.push(u);
  if(_self)CURRENT_USER=u;
  if(SESS&&i>=0&&pass&&!_self){api(Object.assign({action:'resetpass',target:email,neu:pass},authFields())).then(j=>toast(j&&j.ok?'ตั้งรหัสผ่านใหม่ให้ '+email+' แล้ว (ผู้ใช้ต้องเปลี่ยนเองเมื่อเข้าครั้งถัดไป)':'ตั้งรหัสผ่านไม่สำเร็จ: '+((j&&j.error)||''),j&&j.ok?'ok':'bad')).catch(()=>toast('เชื่อมต่อระบบกลางไม่ได้ — รหัสผ่านของผู้ใช้ยังไม่เปลี่ยน','bad'));}
  logAct((i>=0?'แก้ไขผู้ใช้ ':'เพิ่มผู้ใช้ ')+u.email+' ('+(ROLE_TH[u.role]||u.role)+')'+((!_self&&_passChanged&&i>=0)?' · รีเซ็ตรหัสผ่าน':''));save();closeModal();render();toast('บันทึกผู้ใช้แล้ว','ok');
}
function delUser(i){

  if(u.role==='admin'&&DB.meta.users.filter(x=>x.role==='admin').length<=1){toast('ต้องมีหัวหน้างานอย่างน้อย 1 คน','bad');return;}

  logAct('ลบผู้ใช้ '+u.email);DB.meta.users.splice(i,1);save();render();toast('ลบผู้ใช้แล้ว','ok');
}

function roleFromTh(t){t=(''+t).trim().toLowerCase();
  if(!t)return 'staff';
  const map={'ผู้พัฒนา':'admin','ผู้พัฒนา (หัวหน้างาน)':'admin','หัวหน้างาน':'admin','หัวหน้างาน (ผู้ดูแลระบบ)':'admin','ผู้ดูแลระบบ':'admin','admin':'admin',
    'การเงิน':'finance','เจ้าหน้าที่การเงิน':'finance','finance':'finance',
    'นโยบายและแผน':'policy','เจ้าหน้าที่นโยบายและแผน':'policy','แผน':'policy','policy':'policy',
    'ผู้บริหาร':'exec','exec':'exec',
    'เจ้าหน้าที่':'staff','staff':'staff','-':'staff',
    'หัวหน้าโครงการ':'staff','head':'staff','ผู้ประสานงาน':'staff','ประสานงาน':'staff','coord':'staff','สัตวแพทย์':'staff','vet':'staff'};   // บทบาทในโครงการ → เจ้าหน้าที่ (ระบบจับคู่จากทะเบียนเอง)
  return map[t]||'';
}
function parseCSV(text){ // simple CSV parser (handles quotes, commas, CRLF)
  const rows=[];let row=[],cur='',q=false;text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false;} else cur+=c; }
    else{ if(c==='"')q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c==='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>(''+c).trim()!==''));
}
function importUsers(e){
  const f=e.target.files[0];if(!f){return;}
  const r=new FileReader();
  r.onload=()=>{try{
    const rows=parseCSV(r.result);if(!rows.length)throw new Error('ไฟล์ว่าง');
    let start=0;const h0=(rows[0][0]||'').trim().toLowerCase();
    if(h0.indexOf('อีเมล')>=0||h0.indexOf('email')>=0)start=1;   // ข้ามหัวตาราง
    DB.meta.users=DB.meta.users||[];
    let added=0,updated=0,skipped=0;const errRows=[];
    for(let i=start;i<rows.length;i++){
      const c=rows[i];const email=(c[0]||'').trim(),name=(c[1]||'').trim(),roleTh=(c[2]||'').trim();
      if(!email){skipped++;continue;}
      if(email.indexOf('@')<0){errRows.push('บรรทัด '+(i+1)+': อีเมลไม่ถูกต้อง ('+email+')');continue;}
      const role=roleFromTh(roleTh);
      if(!role){errRows.push('บรรทัด '+(i+1)+': ตำแหน่งไม่รู้จัก ('+roleTh+')');continue;}
      const ex=DB.meta.users.find(u=>(''+u.email).toLowerCase()===email.toLowerCase());
      if(ex){ex.name=name||ex.name;
        if(roleTh){                                    // ช่องตำแหน่งว่าง = คงตำแหน่งเดิม
          if(ex.role==='admin'&&role!=='admin'&&DB.meta.users.filter(u=>u.role==='admin').length<=1){errRows.push('บรรทัด '+(i+1)+': ไม่เปลี่ยนตำแหน่ง — ต้องมีหัวหน้างานอย่างน้อย 1 คน ('+email+')');}
          else ex.role=role;}
        updated++;}
      else{DB.meta.users.push({email:email.toLowerCase(),name:name,role:role,pass:'1234',mustChange:true});added++;}
    }
    logAct('นำเข้าผู้ใช้จาก CSV: เพิ่ม '+added+' · อัปเดต '+updated);save();render();
    let msg='นำเข้าสำเร็จ — เพิ่ม '+added+' คน · อัปเดต '+updated+' คน';if(skipped)msg+=' · ข้าม '+skipped;
    toast(msg,'ok');
    if(errRows.length)setTimeout(()=>alert('บางบรรทัดข้ามเพราะข้อมูลผิด:\n\n'+errRows.slice(0,15).join('\n')),300);
  }catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message,'bad');}};
  r.readAsText(f);e.target.value='';
}
function roleReport(){
  const users=DB.meta.users||[];const projs=DB.projects||[];
  const idsOf=u=>[u.email,u.name,u.headName,u.coordName,u.vetName].filter(Boolean).map(x=>(''+x).trim().toLowerCase());
  const matchP=(field,ids)=>{const v=field;if(!v)return false;const pp=splitPerson(v);return ids.includes((''+v).trim().toLowerCase())||(pp.name&&ids.includes(pp.name.toLowerCase()))||(pp.email&&ids.includes(pp.email.toLowerCase()));};
  const rows=users.map((u,i)=>{
    const ids=idsOf(u);
    const asHead=projs.filter(p=>matchP(p.head,ids)).map(p=>p.projNo||p.shortName);
    const asCoord=projs.filter(p=>matchP(p.coordinator,ids)).map(p=>p.projNo||p.shortName);
    const asVet=projs.filter(p=>matchP(p.vet,ids)).map(p=>p.projNo||p.shortName);
    const cell=arr=>arr.length?arr.map(esc).join('<br>'):'<span style="color:#bbb">—</span>';

<td>${cell(asHead)}</td><td>${cell(asCoord)}</td><td>${cell(asVet)}</td></tr>`;
  }).join('');
  return `<div class="rpt" data-orient="landscape" data-pfoot="รายงานบทบาทในโครงการ" style="font-family:'Sarabun';color:#000;font-size:14px">

<div style="text-align:center;font-family:'Sarabun';font-weight:700;font-size:18px">รายงานบทบาทในโครงการ (รายบุคคล)</div>

<table class="rpt-tbl" style="font-size:12.5px;width:100%">
<tr><th style="width:5%">ลำดับ</th><th style="width:20%">ชื่อ-นามสกุล</th><th style="width:15%">หน้าที่หลัก</th><th>เป็นหัวหน้าโครงการ</th><th>เป็นผู้ประสานงาน</th><th>เป็นสัตวแพทย์ประจำโครงการ</th></tr>
      ${rows}

/* ===== แบ่งหน้าเอกสารพิมพ์ + เลขหน้า: ตัดตามบล็อก ไม่ให้หัวข้อ/แถวตารางขาดตอน ===== */
const PAGE_MM={A4:[210,297],Letter:[215.9,279.4],A5:[148,210],Legal:[215.9,355.6]};
function paginatePrint(pa,P){P=P||printPref();
  const roots=pa.querySelectorAll('.rpt');if(roots.length!==1)return;
  const root=roots[0];                                                   // v23: แบ่งหน้าสวยงามให้ทุกรายงาน
  const sz=PAGE_MM[P.size||'A4']||PAGE_MM.A4;
  const land=(P.orient&&P.orient!=='auto'?P.orient:(root.dataset.orient||'portrait'))==='landscape';const W=land?sz[1]:sz[0],H=land?sz[0]:sz[1];
  const mv=P.mv,mh=P.mh;
  const PX=96/25.4;const FOOTH=P.pnum==='none'?0:18;const contentH=(H-3-mv*2-2)*PX-FOOTH,contentW=(W-mh*2);
  // วัดความสูงจริงของแต่ละบล็อกในความกว้างเท่าหน้ากระดาษ
  const meas=document.createElement('div');
  meas.style.cssText=`position:absolute;left:0;top:0;width:${contentW}mm;visibility:hidden;pointer-events:none`;
  root.style.maxWidth='none';root.style.padding='0';root.style.margin='0';
  const paStyle=pa.getAttribute('style')||'';                          // บนหน้าจอ #printArea ซ่อนอยู่ ต้องเปิดชั่วคราวเพื่อวัดขนาด
  pa.style.cssText='display:block;position:absolute;left:-99999px;top:0;width:'+W+'mm;visibility:hidden';
  const restore=()=>{pa.setAttribute('style',paStyle);};
  pa.appendChild(meas);meas.appendChild(root);
  // ความสูงจริงในกระแสเอกสาร (รวม margin ที่ยุบรวมกันแล้ว): วัดจากระยะห่างถึงพี่น้องถัดไป
  const hOf=el=>{const r=el.getBoundingClientRect();const nx=el.nextElementSibling;
    if(nx)return Math.max(0,nx.getBoundingClientRect().top-r.top);
    const pr=el.parentElement.getBoundingClientRect();const cs=getComputedStyle(el);return Math.max(r.height,pr.bottom-r.top)+(parseFloat(cs.marginBottom)||0);};
  const blocks=Array.from(root.children);
  if(!blocks.length||blocks.reduce((a,b)=>a+hOf(b),0)===0){pa.appendChild(root);meas.remove();root.style.maxWidth='';restore();return;}  // สภาพแวดล้อมไม่มี layout (ทดสอบ)
  const units=[];   // {el,h,keepNext}
  const rowsOf=t=>Array.from(t.tBodies.length?t.tBodies[0].rows:t.rows);
  const splitTable=(t)=>{   // ตารางยาว: แยกเป็นแถว โดยหัวตารางติดกับแถวแรกเสมอ
    const hdrRows=Array.from(t.rows).filter(r=>r.querySelector('th')||(t.tHead&&t.tHead.contains(r)));
    const body=Array.from(t.rows).filter(r=>!hdrRows.includes(r));
    const mk=(rs)=>{const nt=t.cloneNode(false);const cg=t.querySelector('colgroup');if(cg)nt.appendChild(cg.cloneNode(true));
      const tb=document.createElement('tbody');hdrRows.forEach(r=>tb.appendChild(r.cloneNode(true)));rs.forEach(r=>tb.appendChild(r.cloneNode(true)));nt.appendChild(tb);return nt;};
    return {hdrH:hdrRows.reduce((a,r)=>a+r.getBoundingClientRect().height,0),body,mk};
  };
  const isSign=el=>!!(el.classList&&(el.classList.contains('rpt-sign')||el.classList.contains('prop-sign')||el.classList.contains('pp-keepprev')));
  const isHead=el=>!!(el.classList&&(el.classList.contains('pp-h')||el.classList.contains('rpt-h3')||el.classList.contains('rpt-pt')||/^H[1-4]$/.test(el.tagName)));
  const addUnits=(b,depth)=>{
    const h=hOf(b);
    if(b.tagName==='TABLE'&&h>contentH*0.5){const st=splitTable(b);st.body.forEach((r,ri)=>units.push({row:r,rowH:r.getBoundingClientRect().height,st,keepNext:false,first:ri===0}));return;}
    const keepAll=b.classList&&(b.classList.contains('pp-keep')||(depth===0&&b.classList.contains('pp-sec')&&b.querySelector('.pp-keep')))&&h<=contentH;   // v39: Gantt ทั้งหัวข้ออยู่หน้าเดียวกัน
    const smallSec=depth===0&&b.classList&&b.classList.contains('pp-sec')&&h<=contentH*0.45;   // หัวข้อสั้น ไม่ตัดกลางหัวข้อ
    if(keepAll||smallSec||h<=contentH*0.3||depth>2||!b.children||b.children.length<2||b.tagName==='TABLE'){units.push({el:b,h,atomic:true,keepNext:isHead(b),keepWithPrev:isSign(b),splittable:(smallSec&&!keepAll&&b.children.length>1)?b:null});return;}
    // บล็อกยาว: แยกเป็นหน่วยย่อย (หัวข้อ + ย่อหน้า/ตาราง) หัวข้อต้องติดกับหน่วยถัดไป
    const kids=Array.from(b.children);
    kids.forEach((k,i)=>{
      const kh=hOf(k);
      if(k.tagName==='TABLE'&&kh>contentH*0.5){
        const st=splitTable(k);
        st.body.forEach((r,ri)=>units.push({row:r,rowH:r.getBoundingClientRect().height,st,keepNext:false,first:ri===0}));
      }else if(kh>contentH*0.3&&k.children&&k.children.length>1){addUnits(k,depth+1);}
      else units.push({el:k,h:kh,keepNext:isHead(k)||i===0,keepPrev:i>0&&kids[i-1].tagName==='TABLE',keepWithPrev:isSign(k)});

  };

  // จัดลงหน้า
  const pages=[];let cur=[],curH=0,curTable=null;
  const flush=()=>{if(cur.length){pages.push(cur);cur=[];curH=0;curTable=null;}};
  for(let i=0;i<units.length;i++){
    const u=units[i];

      if(!curTable||curTable.st!==u.st){curTable={st:u.st,rows:[]};cur.push(curTable);curH+=u.st.hdrH;}

    }
    if(u.keepPrev&&curTable&&curH+u.h>contentH&&curTable.rows.length>2){   // หมายเหตุใต้ตาราง ต้องไม่หลุดไปอยู่หน้าใหม่เดี่ยว ๆ — ดึงแถวท้ายตารางไปด้วย
      const st=curTable.st,moved=curTable.rows.splice(-2,2);
      flush();curTable={st,rows:moved};cur.push(curTable);curH=st.hdrH+moved.reduce((a,r)=>a+r.getBoundingClientRect().height,0);
    }
    curTable=null;
    let need=u.h;
    if(u.keepNext&&units[i+1]&&!units[i+1].row)need+=units[i+1].h;      // หัวข้อต้องมีเนื้อหาตามอย่างน้อย 1 หน่วยในหน้าเดียวกัน
    if(u.keepNext&&units[i+1]&&units[i+1].row)need+=units[i+1].st.hdrH+units[i+1].rowH;
    if(curH+need>contentH&&cur.length&&u.splittable&&(contentH-curH)>contentH*0.1){   // v39: เหลือที่ว่างมาก → ตัดหัวข้อสั้นต่อได้ ให้หน้าเต็มสมดุล
      const kids=Array.from(u.splittable.children);
      const sub=kids.map((k,ki)=>({el:k,h:hOf(k),keepNext:isHead(k)||ki===0,keepWithPrev:isSign(k)}));
      units.splice(i,1,...sub);i--;continue;
    }
    if(curH+need>contentH&&cur.length){
      // ช่องลงนาม/บล็อกท้าย ต้องไม่ลอยไปอยู่หน้าใหม่เดี่ยว ๆ — ดึงหน่วยก่อนหน้าไปด้วย (ถ้าไม่ใหญ่เกิน)
      if(u.keepWithPrev&&cur.length>1&&!cur[cur.length-1].st&&(cur[cur.length-1].h+u.h)<=contentH*0.8){const pv=cur.pop();curH-=pv.h;flush();cur.push(pv);curH+=pv.h;}
      else flush();
    }
    cur.push(u);curH+=u.h;
  }
  flush();
  // สร้างหน้ากระดาษ
  let foot=root.getAttribute('data-pfoot')||'';
  if(!foot){const t=root.querySelector('.rpt-t')||Array.from(root.querySelectorAll('div,h1,h2,h3')).find(e=>e.children.length===0&&/font-weight:\s*700/.test(e.getAttribute('style')||''));foot=t?t.textContent.trim():'';const pt=root.querySelector('.rpt-pt');if(pt)foot+=' · '+pt.textContent.trim().split(' — ')[0];}
  const cs0=getComputedStyle(root);   // อ่านค่าก่อนถอดออกจากเอกสาร · line-height ใช้ค่าที่ประกาศ (เช่น 1.65) ไม่ใช่ค่า px เพื่อให้ตารางตัวเล็กคงระยะบรรทัดเดิม
  const cs={fontFamily:root.style.fontFamily||cs0.fontFamily,fontSize:root.style.fontSize||cs0.fontSize,lineHeight:root.style.lineHeight||'1.65'};

    const page=document.createElement('div');page.className='pp-page';
    page.style.cssText=`width:${W}mm;height:${H-3}mm;padding:${mv}mm ${mh}mm;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;page-break-after:${pi<total-1?'always':'auto'};break-after:${pi<total-1?'page':'auto'}`;
    const body=document.createElement('div');body.className='rpt pp-doc';

  ps.textContent='@media print{@page{size:'+W+'mm '+H+'mm;margin:0}html,body{margin:0!important;padding:0!important;height:auto!important}#printArea{margin:0!important;padding:0!important}#printArea .pp-page{margin:0;page-break-inside:avoid;break-inside:avoid}#printArea .pp-page:last-child{page-break-after:auto!important;break-after:auto!important}}';
  restore();
}

function weekTag(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);return d.getFullYear()+'w'+Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);}
function checkStale(){ // v26: งานค้างเกิน 7 วัน → แจ้งผู้รับผิดชอบสัปดาห์ละครั้ง · เกินกำหนดสิ้นสุดและยังไม่ปิด → แจ้งหัวหน้าโครงการ+หัวหน้างาน
  try{
    const wk=weekTag();const todayISO=new Date().toISOString().slice(0,10);
    (DB.projects||[]).forEach(p=>{
      if(String(p.status||'').indexOf('ปิดแล้ว')===0)return;
      const ns=nextStepHint(p);const age=daysSince(lastActivityAt(p));
      if(ns&&age!=null&&age>=7){
        const tag='stale:'+p.projNo+':'+wk;
        if(!(DB.meta.notifs||[]).some(n=>n.tag===tag)){
          const role=WHO_ROLE[ns.who];const to=role==='head'?p.head:role==='coord'?(p.coordinator||p.head):role;
          if(to){notify(to,'โครงการเลขที่ '+(p.projNo||'')+' ค้างขั้นตอน '+age+' วัน','ขั้นถัดไป: '+ns.what+' (ผู้รับผิดชอบ: '+ns.who+') — ยังไม่มีความเคลื่อนไหวมา '+age+' วัน',p.projNo,null);if(DB.meta.notifs[0])DB.meta.notifs[0].tag=tag;}
        }
      }
      const end=p.endDate||'';
      if(end&&end<todayISO&&String(p.status||'').indexOf('รอปิด')!==0){
        const tag='overdue:'+p.projNo+':'+wk;
        if(!(DB.meta.notifs||[]).some(n=>n.tag===tag)){
          const over=daysSince(tlDate(end));const body='โครงการสิ้นสุดเมื่อ '+fmtDate(end)+' (เกินมา '+over+' วัน) และยังไม่ได้ขอปิดโครงการหรือขยายเวลา';
          if(p.head)notify(p.head,'โครงการเลขที่ '+(p.projNo||'')+' เกินกำหนดสิ้นสุด',body+' — กรุณาขอปิดโครงการ หรือยื่นขอขยายเวลาในระบบ',p.projNo,null);
          notify('admin','โครงการเลขที่ '+(p.projNo||'')+' เกินกำหนดสิ้นสุด',body,p.projNo,null);
          if(DB.meta.notifs[0])DB.meta.notifs[0].tag=tag;
        }
      }
    });
  }catch(e){}
}
function checkExpiry(){
  const today=new Date();const soon=new Date();soon.setDate(today.getDate()+60);
  const tISO=today.toISOString().slice(0,10), sISO=soon.toISOString().slice(0,10);
  const cc=(DB.meta&&DB.meta.ccEmails)||'';
  (DB.projects||[]).forEach(p=>{
    if((p.status||'').indexOf('ปิด')===0)return;   // ข้ามโครงการที่ปิดแล้ว ("ปิดแล้ว"/"ปิดโครงการแล้ว")
    const end=p.endDate||'';if(!end||end<tISO||end>sISO)return;
    const tag='exp:'+p.projNo+':'+end;
    if((DB.meta.notifs||[]).some(n=>n.tag===tag))return; // แจ้งแล้ว
    const days=Math.ceil((new Date(end)-today)/86400000);
    const subj='แจ้งเตือน: โครงการ '+(p.projNo||'')+' ใกล้สิ้นสุด ('+fmtDate(end)+')';
    const ebody='เรียน หัวหน้าโครงการ/ผู้ประสานงาน\n\nโครงการ '+(p.projNo||'')+' "'+(p.fullName||'')+'"\nจะสิ้นสุดวันที่ '+fmtDate(end)+' (อีก '+days+' วัน)\n\nกรุณาพิจารณาดำเนินการปิดโครงการ หรือขออนุมัติขยายระยะเวลา\nหากต้องการขยายเวลา กรุณาเตรียมเอกสารเพื่อเสนอคณะกรรมการบริหารพิจารณาอนุมัติ\n\nศูนย์สัตว์ทดลอง จุฬาฯ';
    const hEmail=userEmailByName(p.head)||'', cEmail=userEmailByName(p.coordinator)||'';
    const to=[hEmail,cEmail,cc].filter(Boolean).join(',');
    const mail=to?{email:hEmail||cEmail,cc:cc,subj:subj,body:ebody}:null;
    const body='โครงการจะสิ้นสุดวันที่ '+fmtDate(end)+' (อีก '+days+' วัน) — กรุณาพิจารณาปิดโครงการ หรือหากต้องการขยายเวลา กรุณาเตรียมเอกสารเพื่อเสนอคณะกรรมการบริหารพิจารณาอนุมัติ';
    if(p.head)notify(p.head,'โครงการเลขที่ '+(p.projNo||'')+' ⏰ ใกล้สิ้นสุด',body,p.projNo,mail);
    if(p.coordinator&&p.coordinator!==p.head)notify(p.coordinator,'โครงการเลขที่ '+(p.projNo||'')+' ⏰ ใกล้สิ้นสุด',body,p.projNo,mail);
    // แท็กกันแจ้งซ้ำ (ติดกับ notif ล่าสุด)
    if(DB.meta.notifs&&DB.meta.notifs[0])DB.meta.notifs[0].tag=tag;
  });
}

async function serverLogin(em,pw){
  const errEl=document.getElementById('lockErr');
  const msg=t=>{errEl.textContent=t;errEl.classList.add('show');};
  msg('กำลังตรวจสอบกับระบบกลาง…');
  let j=null;
  try{j=await api({action:'login',key:(DB.meta&&DB.meta.secret)||'',email:em,pass:pw});}
  catch(e){msg('เชื่อมต่อระบบกลางไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');return;}
  if(!j||!j.ok){const er=String((j&&j.error)||'');
    if(/bootstrap/.test(er)){tryLogin(true);return;}                       // ชีตยังไม่มีผู้ใช้ — ตั้งระบบครั้งแรกจากเครื่องหัวหน้างาน
    if(/locked/.test(er)){msg('ใส่รหัสผิดหลายครั้ง ระบบพักบัญชีนี้ 10 นาที');return;}
    if(/unknown action/.test(er)){msg('ระบบกลาง (Apps Script) ยังเป็นรุ่นเก่า — ต้องอัปเดตเป็น Code v6 และ Deploy ใหม่');return;}
    LOGIN_FAILS++;if(LOGIN_FAILS>=LOGIN_MAX_FAILS){LOGIN_LOCK_UNTIL=Date.now()+LOGIN_LOCK_SEC*1000;LOGIN_FAILS=0;}
    msg('อีเมลหรือรหัสผ่านไม่ถูกต้อง');document.getElementById('pin').value='';return;}
  const me0=j.user||{};
  applyServerData(j.data||{},normRole(me0.role));
  setSess({tok:j.token,email:em});
  const u=(DB.meta.users||[]).find(x=>(x.email||'').toLowerCase()===em)||me0;
  finishLogin(u,!!j.mustChange);
}
function applyServerData(d,role){

    mergeTable('proposals',Array.isArray(d.proposals)?d.proposals:[],first);

    if(Array.isArray(m.users)&&m.users.length)mergeTable('users',m.users,first||role!=='admin');
    mergeTable('notifs',Array.isArray(m.notifs)?m.notifs:[],first);
    if(m.pins)DB.meta.pins=Object.assign({},DB.meta.pins,m.pins);

}

function pwErr(t){const e=document.getElementById('pw_err');if(!e){if(t)toast(t,'bad');return;}e.textContent=t||'';e.style.display=t?'block':'none';}
function doPassChange(force){
  if(!CURRENT_USER)return;
  const o=((document.getElementById('pw_old')||{}).value||'');
  const a=((document.getElementById('pw_new')||{}).value||'').trim(),b=((document.getElementById('pw_new2')||{}).value||'').trim();
  if(SESS&&cloudCfg()){                     // v38: เปลี่ยนที่ระบบกลางโดยตรง สำเร็จจึงแจ้ง
    if(!force&&!o){pwErr('กรอกรหัสผ่านปัจจุบัน');return;}
    if(a.length<6){pwErr('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร');return;}
    if(a==='1234'){pwErr('ห้ามใช้ 1234');return;}
    if(!/[0-9]/.test(a)||!/[A-Za-zก-๙]/.test(a)){pwErr('รหัสผ่านใหม่ต้องมีทั้งตัวอักษรและตัวเลข');return;}
    if(a!==b){pwErr('ช่องยืนยันไม่ตรงกับรหัสผ่านใหม่');return;}
    const btn=document.getElementById('pw_btn');if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก…';}
    pwErr('');
    api(Object.assign({action:'setpass',old:o,neu:a},authFields())).then(j=>{
      if(j&&j.ok){delete CURRENT_USER.mustChange;PASS_LOCK=false;closeModal();logAct('เปลี่ยนรหัสผ่านของตนเอง');save();
        toast('เปลี่ยนรหัสผ่านแล้ว — ใช้รหัสใหม่ได้ทุกเครื่องทันที','ok');if(force){try{maybeShowGuide();}catch(e){}}return;}
      const er=String((j&&j.error)||'');
      if(btn){btn.disabled=false;btn.textContent='บันทึกรหัสผ่าน';}
      if(/old password/.test(er))pwErr('รหัสผ่านปัจจุบันไม่ถูกต้อง');
      else if(/same password/.test(er))pwErr('รหัสใหม่ต้องไม่ซ้ำกับรหัสเดิม');
      else if(/weak/.test(er))pwErr('รหัสผ่านใหม่สั้นเกินไป หรือเป็น 1234');
      else if(isSessErr(er)){pwErr('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');setTimeout(()=>{PASS_LOCK=false;closeModal();logout();},1500);}
      else pwErr('บันทึกไม่สำเร็จ ('+er+') — รหัสผ่านยังเป็นรหัสเดิม');
    }).catch(()=>{if(btn){btn.disabled=false;btn.textContent='บันทึกรหัสผ่าน';}pwErr('เชื่อมต่อระบบกลางไม่ได้ — รหัสผ่านยังเป็นรหัสเดิม กรุณาลองใหม่');});
    return;
  }
  if(!force&&!pwMatch(CURRENT_USER,o)){pwErr('รหัสผ่านปัจจุบันไม่ถูกต้อง');return;}
  if(a.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','bad');return;}
  if(a==='1234'||pwMatch(CURRENT_USER,a)){toast('ต้องไม่ใช่รหัสเดิมหรือรหัสเริ่มต้น','bad');return;}
  if(!/[0-9]/.test(a)||!/[A-Za-zก-๙]/.test(a)){toast('รหัสผ่านควรมีทั้งตัวอักษรและตัวเลข','bad');return;}
  if(a!==b){toast('ยืนยันรหัสผ่านไม่ตรงกัน','bad');return;}
  const u=(DB.meta.users||[]).find(x=>(x.email||'').toLowerCase()===(CURRENT_USER.email||'').toLowerCase())||CURRENT_USER;
  if(cloudCfg()&&AUTH_OLD==null)AUTH_OLD=String(u.pass);
  u.pass=pwHash(a);delete u.mustChange;CURRENT_USER=u;if(cloudCfg())BOOT_PW=a;
  PASS_LOCK=false;
  logAct('เปลี่ยนรหัสผ่านของตนเอง');
  save();closeModal();render();toast('เปลี่ยนรหัสผ่านแล้ว','ok');
  if(force){try{maybeShowGuide();}catch(e){}}
  // v22: ไม่แสดงกล่องสรุปงานหลังเปลี่ยนรหัส
}
let LOGOUT_FLUSH=false;
function logout(){   // v38.4: ส่งงานที่ค้างของผู้ใช้คนนี้ขึ้นระบบกลางก่อน (ในนามตัวเอง) แล้วจึงออก
  try{if(SESS&&cloudCfg()&&!LOGOUT_FLUSH&&buildOps().length){LOGOUT_FLUSH=true;clearTimeout(PUSH_T);PUSH_T=null;const done=()=>{LOGOUT_FLUSH=false;doLogout();};cloudPush().then(done,done);return;}}catch(e){}
  doLogout();
}
function doLogout(){DASH_MORE=null;try{if(SESS&&cloudCfg())api({action:'logout',token:SESS.tok}).catch(()=>{});}catch(e){}setSess(null);BOOT_PW=null;PASS_LOCK=false;stopPoll();try{LEDFILTER='';BANKSEL=null;PROPSEL=null;FIN_PROJ='';DASHQ='';AUTH_OLD=null;}catch(e){}ROLE=null;CURRENT_USER=null;EDIT_NO=null;FIN_EDIT=null;REGSEL=null;PENDING_PDF=undefined;document.getElementById('pin').value='';document.getElementById('lockErr').classList.remove('show');document.getElementById('lock').classList.remove('hide');document.getElementById('loginEmail').focus();}
function applyRole(){
  const viewOnly=(ROLE==='staff'||ROLE==='exec');
  document.body.classList.toggle('role-viewer',viewOnly);
  const allow=NAV[ROLE]||['dash'];
  document.querySelectorAll('#nav button[data-v]').forEach(b=>{const v=b.dataset.v;b.style.display=((v==='settings')?(ROLE==='admin'):allow.includes(v))?'':'none';});
  document.querySelectorAll('#nav button.ext-link').forEach(b=>{const key=b.dataset.url;b.style.display=(DB.meta&&DB.meta[key])?'':'none';});
  const who=CURRENT_USER?esc(CURRENT_USER.name||CURRENT_USER.email):'';
  const _pr=CURRENT_USER?projRolesOf(CURRENT_USER):[];const _prTxt=_pr.length?[...new Set(_pr.map(x=>x.role))].join(' · ')+' ('+_pr.length+' โครงการ)':'';
  const scope=(ROLE==='staff')?'<br><span style="font-size:12.5px">'+(_prTxt?esc(_prTxt):'ยังไม่มีบทบาทในโครงการใด')+'</span>':(_prTxt?'<br><span style="font-size:12.5px">+ '+esc(_prTxt)+'</span>':'');
  document.getElementById('roleBadge').innerHTML=`<div class="role-badge">${who}<br><b>${ROLE_TH[ROLE]||ROLE}</b>${scope} ${ROLE==='exec'?'·<span class="lo" onclick="openLogView()">ประวัติการใช้งาน</span> ':''}·<span class="lo" onclick="openPassChange(false)">เปลี่ยนรหัสผ่าน</span> ·<span class="lo" onclick="logout()">ออกจากระบบ</span></div>`;
  updNotifBell();
  if(!allow.includes(VIEW)){VIEW='dash';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='dash'));}
  tidyNavGroups();
}
function tidyNavGroups(){
  // ซ่อนหัวข้อกลุ่มที่ไม่มีเมนูแสดงอยู่ใต้มัน (ตามสิทธิ์ผู้ใช้)
  const nav=document.getElementById('nav');if(!nav)return;
  const kids=[...nav.children];
  kids.forEach((el,i)=>{
    if(!el.classList||!el.classList.contains('nav-group'))return;
    let anyVisible=false;
    for(let j=i+1;j<kids.length;j++){
      if(kids[j].classList&&kids[j].classList.contains('nav-group'))break;
      if(kids[j].tagName==='BUTTON'&&kids[j].style.display!=='none'){anyVisible=true;break;}
    }
    el.classList.toggle('hide',!anyVisible);
  });
}
boot();
function tickClock(){
  const el=document.getElementById('clockBox');if(!el)return;
  const d=new Date();
  const TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const p2=x=>String(x).padStart(2,'0');
  el.innerHTML='<div class="t">'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())+'</div>'
    +'<div class="d">'+TH[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()]+' '+(d.getFullYear()+543)+'</div>';
}
setInterval(tickClock,1000);
window.addEventListener('beforeunload',function(e){try{if(ROLE&&cloudCfg()&&(PUSH_T||SYNC_STATE==='push'||SYNC_STATE==='err')){e.preventDefault();e.returnValue='';}}catch(x){}});
function boot(){tickClock();var l=document.getElementById('brandLogo');if(l)l.src=LOGO;var k=document.getElementById('lockLogo');if(k)k.src=LOGO;var e=document.getElementById('loginEmail');if(e)e.focus();if(SESS&&cloudCfg())resumeSession();}
</script>
